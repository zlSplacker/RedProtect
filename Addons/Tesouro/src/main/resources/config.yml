# Tesouro — /tesouro leva os jogadores ao mundo dos tesouros

# nome do mundo (o nome da pasta do mundo no servidor)
mundo: tesouro

# ponto de chegada; "definido: false" usa o spawn do mundo.
# Para escolher o ponto, fique no lugar desejado e use /tesouro definir
local:
  definido: false
  x: 0.0
  y: 64.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

prefixo: '&6[Tesouro] '
mensagens:
  teleportado: '&eVocê chegou ao mundo dos tesouros! Boa caçada.'
  mundo-nao-encontrado: '&cO mundo dos tesouros ({mundo}) não está disponível agora. Avise a equipe.'
  falhou: '&cNão foi possível teleportar agora. Tente de novo.'
  sem-permissao: '&cVocê não tem permissão para isso.'
  so-jogador: '&cEste comando só pode ser usado por um jogador dentro do jogo.'
  definido: '&aPonto de chegada do /tesouro definido aqui (mundo {mundo}).'
  recarregado: '&aConfiguração do Tesouro recarregada.'
  jogador-offline: '&cO jogador {jogador} não está online.'
  enviado: '&a{jogador} foi enviado ao mundo dos tesouros.'
