<style>
:root{
  --chao:#F2F4F1;--sup:#FFFFFF;--sup2:#F7F9F7;
  --tinta:#16221E;--tinta2:#4B5853;--tinta3:#76827D;
  --linha:#D3DBD6;--linha2:#E4E9E5;
  --acento:#1D5A73;--acento-forte:#154559;--acento-suave:#E1EDF1;--acento-texto:#154559;--sobre-acento:#FFFFFF;
  --ok:#2E7549;--ok-suave:#E2F1E6;
  --pend:#B42318;--pend-suave:#FBE9E6;--sobre-pend:#FFFFFF;
  --aviso:#8F5500;--aviso-suave:#FCF0D8;
  --veu:rgba(12,20,17,.45);
  --sombra:0 1px 2px rgba(22,34,30,.06),0 4px 14px rgba(22,34,30,.06);
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --mesa:#1D5A73;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --chao:#0F1513;--sup:#161E1B;--sup2:#1B2522;
    --tinta:#E2E9E5;--tinta2:#A8B5AF;--tinta3:#7C8984;
    --linha:#2C3833;--linha2:#232E2A;
    --acento:#7FB9D1;--acento-forte:#A3CFE1;--acento-suave:#1A323C;--acento-texto:#A9D4E6;--sobre-acento:#0C1417;
    --ok:#6CC08A;--ok-suave:#16301F;
    --pend:#F28B7F;--pend-suave:#3A1B18;--sobre-pend:#1C0C0A;
    --aviso:#E5B35B;--aviso-suave:#33270F;
    --veu:rgba(0,0,0,.6);
    --sombra:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    --mesa:#123C4D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --chao:#0F1513;--sup:#161E1B;--sup2:#1B2522;
  --tinta:#E2E9E5;--tinta2:#A8B5AF;--tinta3:#7C8984;
  --linha:#2C3833;--linha2:#232E2A;
  --acento:#7FB9D1;--acento-forte:#A3CFE1;--acento-suave:#1A323C;--acento-texto:#A9D4E6;--sobre-acento:#0C1417;
  --ok:#6CC08A;--ok-suave:#16301F;
  --pend:#F28B7F;--pend-suave:#3A1B18;--sobre-pend:#1C0C0A;
  --aviso:#E5B35B;--aviso-suave:#33270F;
  --veu:rgba(0,0,0,.6);
  --sombra:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --mesa:#123C4D;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;margin:0;background:var(--chao);color:var(--tinta);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* topo */
.topo{position:relative;flex:none;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--sup);border-bottom:1px solid var(--linha)}
.topo-in{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:10px 20px}
.marca{display:flex;align-items:center;gap:10px;font:600 19px/1.1 var(--f-serif);letter-spacing:-.01em;margin:0}
.marca img{width:32px;height:32px;flex:none;display:block}
.marca small{display:block;font:500 11px/1.3 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3);margin-top:2px}
/* barra de menus no estilo do S.R.I.: Cadastros abre um submenu ao passar o mouse */
.menubar{display:flex;align-items:stretch;gap:2px;align-self:stretch;margin-block:-10px}
.mb-item{position:relative;display:flex}
.mb-btn{display:inline-flex;align-items:center;gap:6px;border:0;border-bottom:2px solid transparent;background:transparent;padding:0 12px;font-weight:600;color:var(--tinta2);min-height:44px}
.mb-btn svg{width:14px;height:14px;opacity:.7}
.mb-btn:hover,.mb-item:hover>.mb-btn,.mb-item.aberto>.mb-btn{color:var(--tinta);background:var(--sup2)}
.mb-btn[aria-current="page"]{color:var(--tinta);border-bottom-color:var(--acento)}
.mb-sub{display:none;position:absolute;left:0;top:100%;z-index:35;min-width:220px;background:var(--sup);border:1px solid var(--linha);border-radius:0 0 10px 10px;box-shadow:var(--sombra);padding:6px}
.mb-item:hover>.mb-sub,.mb-item.aberto>.mb-sub{display:grid}
.mb-item.suprimir:hover>.mb-sub{display:none}
/* submenu em cascata (Indicadores → Pessoal → …) */
.mb-grupo{position:relative;display:grid}
.mb-op.mb-op-sub{grid-template-columns:auto 1fr auto}
.mb-op-sub::after{content:"";width:7px;height:7px;border-right:1.8px solid currentColor;border-top:1.8px solid currentColor;transform:rotate(45deg);opacity:.6;margin-left:14px}
.mb-sub2{display:none;position:absolute;left:100%;top:-6px;z-index:36;min-width:210px;background:var(--sup);border:1px solid var(--linha);border-radius:10px;box-shadow:var(--sombra);padding:6px}
.mb-sub2.esq{left:auto;right:100%}
.mb-grupo:hover>.mb-sub2,.mb-grupo.aberto>.mb-sub2{display:grid}
.mb-grupo:hover>.mb-op-sub,.mb-grupo.aberto>.mb-op-sub{background:var(--acento-suave)}
.mb-op{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:7px;color:var(--tinta)}
.mb-op svg{width:18px;height:18px;color:var(--acento)}
.mb-op span{font-weight:600;white-space:nowrap}
.mb-op:hover,.mb-op:focus-visible{background:var(--acento-suave)}
.mb-op[aria-current="page"] span{color:var(--acento-texto)}
@media (max-width:560px){
  .menubar{width:100%;margin-block:0 -10px;gap:0;flex-wrap:wrap}
  .mb-btn{padding:0 8px;min-height:40px;font-size:13.5px;gap:3px}
  .mb-btn svg{width:12px;height:12px}
  .mb-sub{min-width:0;width:max-content;max-width:calc(100vw - 32px)}
  .mb-sub2{position:static;box-shadow:none;border:0;border-left:2px solid var(--linha);border-radius:0;margin:2px 0 4px 18px;padding:0 0 0 6px;min-width:0}
  .mb-op-sub::after{transform:rotate(135deg)}
  .mb-grupo:hover>.mb-sub2{display:none}
  .mb-grupo.aberto>.mb-sub2{display:grid}
}
.topo-dir{margin-left:auto;display:flex;align-items:center;gap:12px}
.salvo{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tinta3);white-space:nowrap}
.salvo::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.salvo[data-estado="salvando"]::before{background:var(--aviso)}
.salvo[data-estado="aviso"]::before{background:var(--pend)}
.salvo[data-estado="carregando"]::before{background:var(--tinta3)}
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--sup);border:1px solid var(--linha);border-radius:10px;box-shadow:var(--sombra);padding:6px;display:grid;min-width:250px;z-index:30}
.menu-pop button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:7px;display:flex;gap:10px;align-items:center}
.menu-pop button:hover{background:var(--sup2)}
.menu-pop p{margin:4px 10px 6px;font-size:12px;color:var(--tinta3);max-width:32ch}

/* área de trabalho: abaixo da barra de menus fica só o azul do sistema; cada tela abre numa janela */
.area{flex:1;min-height:0;position:relative;z-index:0;overflow:hidden;background:var(--mesa)}
.jan{position:absolute;display:flex;flex-direction:column;background:var(--chao);border:1px solid rgba(0,0,0,.28);border-radius:8px;box-shadow:0 14px 44px rgba(0,0,0,.34),0 2px 6px rgba(0,0,0,.18);overflow:hidden;container-type:inline-size;outline:none}
.jan.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0}
.jan-cab{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 4px 0 12px;background:var(--sup2);color:var(--tinta2);border-bottom:1px solid var(--linha);user-select:none;touch-action:none}
.jan.ativa .jan-cab{background:var(--acento-forte);color:var(--sobre-acento);border-bottom-color:transparent}
.jan-tit{flex:1;min-width:0;margin:0;font:600 13px/1.2 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jan-bts{display:flex;gap:2px}
.jan-bt{width:32px;height:28px;display:grid;place-items:center;border:0;border-radius:5px;background:transparent;color:inherit;padding:0}
.jan-bt svg{width:16px;height:16px}
.jan-bt:hover{background:rgba(127,127,127,.22)}
.jan-fechar:hover{background:#C42B1C;color:#fff}
.area.estreita .jan-max{display:none}
.jan-corpo{flex:1;min-height:0;overflow:auto;container-type:size;overscroll-behavior:contain}
.jan-r{position:absolute;z-index:4}
.jan-r.n,.jan-r.s{left:10px;right:10px;height:6px;cursor:ns-resize}
.jan-r.n{top:0}.jan-r.s{bottom:0}
.jan-r.e,.jan-r.w{top:10px;bottom:10px;width:6px;cursor:ew-resize}
.jan-r.e{right:0}.jan-r.w{left:0}
.jan-r.ne,.jan-r.nw,.jan-r.se,.jan-r.sw{width:12px;height:12px}
.jan-r.ne{top:0;right:0;cursor:nesw-resize}.jan-r.sw{bottom:0;left:0;cursor:nesw-resize}
.jan-r.nw{top:0;left:0;cursor:nwse-resize}.jan-r.se{bottom:0;right:0;cursor:nwse-resize}
.jan.max .jan-r{display:none}
body.arrastando{user-select:none}
body.arrastando .jan-corpo{pointer-events:none}
/* diálogos (Exigência, Dados, visualizar) cobrem só a janela de onde vieram */
.jan .modal{position:absolute;inset:36px 0 0;z-index:6;padding:14px}
.jan .modal-painel{max-width:none}
.tarefas{flex:none;display:flex;align-items:center;gap:8px;padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));background:var(--sup);border-top:1px solid var(--linha)}
.tarefas-lista{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto}
.tarefa{flex:0 1 220px;min-width:90px;border:1px solid var(--linha);background:var(--sup2);border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--tinta2);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tarefa:hover{border-color:var(--tinta3)}
.tarefa[aria-pressed="true"]{background:var(--acento-suave);border-color:var(--acento);color:var(--acento-texto)}
.tarefa.min{font-weight:500;font-style:italic}
@media (max-width:560px){#lado-a-lado{display:none}}

/* dentro da janela: a lista (pesquisa) ou a ficha aberta */
.lateral{padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.lat-cab{display:flex;align-items:baseline;gap:10px}
.lat-acoes{display:flex;flex-wrap:wrap;gap:6px}
.lat-acoes:empty{display:none}
.detalhe{padding:14px 18px 28px;min-width:0}
.jan.ver-detalhe .lateral{display:none}
.jan:not(.ver-detalhe) .detalhe{display:none}
/* o título da janela já diz o que ela mostra */
.cab-txt>.sobre,.cab-txt>.titulo{display:none}
@container (max-width:860px){
  .lateral,.detalhe{padding-inline:12px}
}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--linha);background:var(--sup);color:var(--tinta);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap;min-height:34px}
.btn:hover:not(:disabled){border-color:var(--tinta3)}
.btn svg{width:16px;height:16px;flex:none}
.btn-prim{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}
.btn-prim:hover:not(:disabled){background:var(--acento-forte);border-color:var(--acento-forte)}
.btn-fant{border-color:transparent;background:transparent;color:var(--tinta2)}
.btn-fant:hover:not(:disabled){background:var(--sup2);border-color:transparent;color:var(--tinta)}
.btn-perigo{color:var(--pend)}
.btn-ico{padding:0;width:32px;min-height:32px;height:32px}
.btn[data-armado]{background:var(--pend);border-color:var(--pend);color:var(--sobre-pend);width:auto;padding:0 10px}
.btn-sm{min-height:28px;padding:4px 9px;font-size:12.5px}
.campo{display:grid;gap:5px;min-width:0}
.rot{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3)}
.inp{width:100%;border:1px solid var(--linha);background:var(--sup);border-radius:7px;padding:8px 10px;font-size:14px;line-height:1.4;min-width:0}
.inp:hover{border-color:var(--tinta3)}
.inp:focus{border-color:var(--acento);outline:none;box-shadow:0 0 0 3px var(--acento-suave)}
textarea.inp{resize:vertical;min-height:38px;display:block}
.inp[readonly]{background:var(--sup2);color:var(--tinta2);cursor:default}
.linha-ordem{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.linha-ordem .campo-situacao .inp{width:200px;max-width:100%}
.linha-dir{margin-left:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.linha-dir .inp{width:185px;max-width:100%}
@container (max-width:640px){.linha-dir{margin-left:0}}
.linha-3{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.campo-curto .inp{max-width:140px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.inp[readonly]:hover,.inp[readonly]:focus{border-color:var(--linha);box-shadow:none}
select.inp{padding-right:28px}
.dica{margin:0;font-size:13px;color:var(--tinta3)}
.busca{position:relative}
.busca svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--tinta3);pointer-events:none}
.busca .inp{padding-left:32px}

/* lista lateral */
.itens{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.item{width:100%;text-align:left;border:1px solid var(--linha2);background:var(--sup);border-radius:9px;padding:12px 14px;display:grid;gap:4px}
.item:hover{border-color:var(--acento)}
.item[aria-current="true"]{border-color:var(--linha)}
.vinc .item{background:var(--sup2)}
.item-tit{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item-sub{font-size:12.5px;color:var(--tinta2);overflow-wrap:anywhere}
.item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--tinta3);font-variant-numeric:tabular-nums}
.barra{height:4px;border-radius:2px;background:var(--linha2);overflow:hidden;flex:1 1 60px;max-width:110px}
.barra>i{display:block;height:100%;background:var(--acento);border-radius:2px}
.barra-g{height:6px;max-width:none;border-radius:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sup2);color:var(--tinta2);border:1px solid var(--linha2);white-space:nowrap}
.chip-pend{background:var(--pend-suave);color:var(--pend);border-color:transparent}
.chip-ok{background:var(--ok-suave);color:var(--ok);border-color:transparent}
.chip-ex{background:var(--aviso-suave);color:var(--aviso);border-color:transparent}
.chip-acento{background:var(--acento-suave);color:var(--acento-texto);border-color:transparent}
.item-num{font:500 12.5px var(--f-mono);color:var(--acento-texto);margin-right:6px}
/* linha da consulta de protocolos: Protocolo | Município | Interessado ... Situação (colunas alinhadas entre as linhas) */
.item.item-prot{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 12rem;align-items:center;gap:0;font-size:14px}
.prot-campo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prot-campo + .prot-campo{border-left:1px solid var(--linha);margin-left:12px;padding-left:12px}
.prot-campo .rot-in{color:var(--tinta3);font-size:12.5px;font-weight:600;margin-right:5px}
.prot-campo b{font-weight:600}
.prot-campo .item-num{font-size:13.5px;margin:0}
.item-prot > .chip{justify-self:end;margin-left:12px}
@container (max-width:560px){
  .item.item-prot{grid-template-columns:minmax(0,1fr) auto;align-items:start;row-gap:2px}
  .prot-campo{grid-column:1;white-space:normal;overflow-wrap:anywhere}
  .prot-campo + .prot-campo{border-left:0;margin-left:0;padding-left:0}
  .item-prot > .chip{grid-column:2;grid-row:1}
}
.lat-vazio{padding:12px;border:1px dashed var(--linha);border-radius:9px;color:var(--tinta3);font-size:13px}

/* cabeçalho do detalhe */
.cab{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px 24px;margin-bottom:18px}
.cab-txt{min-width:0;flex:1 1 360px;display:grid;gap:4px;justify-items:start}
.sobre{font:500 11.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-texto)}
.titulo{font:600 27px/1.2 var(--f-serif);letter-spacing:-.01em;margin:2px 0 0;overflow-wrap:anywhere}
.subt{color:var(--tinta2);margin:0}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nota{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:9px;background:var(--aviso-suave);color:var(--tinta);font-size:13.5px;margin-bottom:16px}
.nota svg{width:16px;height:16px;color:var(--aviso);flex:none;margin-top:2px}
.nota-acao{margin-left:auto}
.nota-info{background:var(--acento-suave)}
.nota-info svg{color:var(--acento)}

/* análise */
.ident{min-width:0;display:grid;align-items:end;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;padding:16px;background:var(--sup);border:1px solid var(--linha);border-radius:10px;margin:0 0 22px}
.ident legend{float:left;grid-column:1/-1;width:100%;padding:0;margin-bottom:2px;font:600 15px/1.3 var(--f-serif)}
.an-grade{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;align-items:start}
.resumo{position:sticky;top:12px;display:grid;gap:12px;background:var(--sup);border:1px solid var(--linha);border-radius:10px;padding:16px;max-height:calc(100cqh - 24px);overflow:auto}
.res-prog{display:flex;align-items:baseline;gap:8px}
.res-num{font:600 26px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.res-rot{color:var(--tinta2)}
.res-cont{display:flex;gap:6px;flex-wrap:wrap}
.res-tit{margin:6px 0 0;font:600 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3)}
.res-lista{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.res-item{width:100%;display:grid;grid-template-columns:auto 1fr;gap:8px;text-align:left;border:0;background:transparent;border-radius:7px;padding:7px 8px;font-size:13px;line-height:1.35}
.res-item:hover{background:var(--pend-suave)}
.res-item .q-num{color:var(--pend)}
@container (max-width:1180px){.an-grade{grid-template-columns:minmax(0,1fr)}.resumo{position:static;max-height:none;order:-1}}
.filtro-q{display:inline-flex;gap:3px;background:var(--sup2);border:1px solid var(--linha2);border-radius:9px;padding:3px;margin-bottom:14px;flex-wrap:wrap}
.filtro-q button{border:0;background:transparent;border-radius:6px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--tinta2)}
.filtro-q button[aria-pressed="true"]{background:var(--sup);color:var(--tinta);box-shadow:var(--sombra)}

/* questionário */
.quest{display:grid;gap:10px}
.q-sec{display:grid;gap:10px;margin-top:22px}
.q-sec:first-child{margin-top:0}
.q-sec-cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding-bottom:7px;border-bottom:1px solid var(--linha)}
.q-sec-tit{font:600 19px/1.3 var(--f-serif);margin:0}
.q-sec-ref{font:12px/1.4 var(--f-mono);color:var(--tinta3)}
.q{background:var(--sup);border:1px solid var(--linha2);border-radius:10px;padding:14px 16px;display:grid;gap:10px;scroll-margin-top:16px;transition:border-color .2s,box-shadow .2s}
.q .q{background:var(--sup2);padding:12px 14px}
.q.pendente{border-color:color-mix(in srgb,var(--pend) 50%,var(--linha2))}
.q.destaque{box-shadow:0 0 0 3px var(--acento-suave);border-color:var(--acento)}
.q-cab{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:start}
.q-estado{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--tinta3);margin-top:6px}
.q.respondida>.q-cab .q-estado{background:var(--ok);border-color:var(--ok)}
.q.pendente>.q-cab .q-estado{background:var(--pend);border-color:var(--pend)}
.q-num{font:500 13px/1.65 var(--f-mono);color:var(--acento-texto);font-variant-numeric:tabular-nums;min-width:2ch;white-space:nowrap}
.q-txt{margin:0;font-weight:500;font-size:15px;line-height:1.45;text-wrap:pretty;overflow-wrap:anywhere}
.carimbo{font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--pend);border:1.5px solid currentColor;border-radius:3px;padding:4px 6px;transform:rotate(-3deg);white-space:nowrap;margin-top:2px}
.q-corpo{display:grid;gap:10px;padding-left:calc(20px + 2ch + 10px)}
.q-fund{margin:0;font:italic 14px/1.4 var(--f-serif);color:var(--tinta2)}
.q-fund::before{content:"§\00a0";font-style:normal;color:var(--tinta3)}
.q-ops{display:flex;flex-wrap:wrap;gap:6px}
.op{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linha);background:var(--sup);border-radius:7px;padding:6px 12px;font-weight:500;min-height:34px;text-align:left;line-height:1.3}
.op:hover{border-color:var(--acento)}
.op::before{content:"";width:12px;height:12px;border:1.5px solid currentColor;border-radius:50%;flex:none;opacity:.55}
.op[data-multi]::before{border-radius:3px}
.op[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}
.op[aria-pressed="true"]::before{background:currentColor;opacity:1;box-shadow:inset 0 0 0 2px var(--acento)}
.op.op-pend[aria-pressed="true"]{background:var(--pend);border-color:var(--pend);color:var(--sobre-pend)}
.op.op-pend[aria-pressed="true"]::before{box-shadow:inset 0 0 0 2px var(--pend)}
.q-extra{display:flex;gap:4px;flex-wrap:wrap;margin-left:-8px}
.q-extra .btn{min-height:28px;padding:3px 8px;font-size:12.5px;font-weight:500}
.q-extra .btn[aria-expanded="true"]{color:var(--acento-texto)}
.q-ajuda{margin:0;padding:10px 12px;background:var(--acento-suave);border-radius:8px;font-size:13.5px;max-width:75ch}
.q-prov{margin:0;padding:10px 12px;background:var(--pend-suave);border-radius:8px;font-size:13.5px;max-width:75ch}
.q-prov strong{color:var(--pend);font-weight:600}
.q-filhos{display:grid;gap:8px;padding-left:14px;border-left:2px dotted var(--linha);margin-left:4px}
.q.compacto>.q-corpo{display:none}
.q.compacto>.q-cab{opacity:.62}
@container (max-width:640px){.q-corpo{padding-left:0}.q{padding:12px}.q .q{padding:10px 12px}.q-filhos{padding-left:10px;margin-left:0}}

/* editor de modelo */
.ed-nome{width:100%;font:600 26px/1.25 var(--f-serif);letter-spacing:-.01em;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;margin-left:-9px}
.ed-nome:hover{border-color:var(--linha)}
.ed-nome:focus{border-color:var(--acento);background:var(--sup);outline:none;box-shadow:0 0 0 3px var(--acento-suave)}
.ed-topo{display:grid;gap:10px;margin-bottom:18px}
.ed-meta{font:12.5px var(--f-mono);color:var(--tinta3);margin:0}
.ed-arvore{display:grid;gap:10px}
.ed-no{background:var(--sup);border:1px solid var(--linha2);border-radius:10px;padding:12px 14px;display:grid;gap:10px;min-width:0}
.ed-no .ed-no{background:var(--sup2)}
.ed-secao{background:transparent;border:1px dashed var(--linha);padding:14px}
.ed-secao>.ed-linha .inp{font:600 17px/1.3 var(--f-serif)}
.ed-linha{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ed-num{font:500 13px/36px var(--f-mono);color:var(--acento-texto);min-width:3.2ch}
.ed-sec-rot{font:600 11px/36px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3)}
.ed-texto{flex:1 1 260px}
.ed-tipo{flex:0 1 210px}
.ed-acoes{display:flex;gap:2px;margin-left:auto}
.ed-cond,.ed-flags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--tinta2)}
.ed-cond>span:first-child,.ed-flags>span:first-child{margin-right:2px}
.tog{border:1px solid var(--linha);background:var(--sup);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:500;min-height:26px}
.tog:hover{border-color:var(--acento)}
.tog[aria-pressed="true"]{background:var(--acento-suave);border-color:var(--acento);color:var(--acento-texto)}
.tog.tog-pend[aria-pressed="true"]{background:var(--pend-suave);border-color:var(--pend);color:var(--pend)}
.ed-ops{display:grid;gap:6px}
.ed-op{display:flex;gap:6px;align-items:center}
.ed-op .inp{flex:1 1 auto}
.ed-det>summary{cursor:pointer;font-size:13px;color:var(--tinta2);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:2px 0}
.ed-det>summary:hover{color:var(--tinta)}
.ed-det>summary em{font:italic 13.5px var(--f-serif);color:var(--tinta3)}
.ed-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.ed-campos .largo{grid-column:1/-1}
.ed-filhos{display:grid;gap:8px;padding-left:14px;border-left:2px dotted var(--linha)}
.ed-add{display:flex;gap:8px;flex-wrap:wrap}
.ed-fim{margin-top:14px}

/* vazio, modal, aviso */
.vazio{max-width:600px;margin:6vh 0;display:grid;gap:14px;justify-items:start}
.vazio h2{font:600 24px/1.25 var(--f-serif);margin:0}
.vazio p{margin:0;color:var(--tinta2);max-width:60ch}
.form-nova{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:760px;background:var(--sup);border:1px solid var(--linha);border-radius:10px;padding:20px}
.form-nova .largo{grid-column:1/-1}
.modal{position:fixed;inset:0;z-index:40;background:var(--veu);display:flex;justify-content:center;align-items:flex-start;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
.modal-painel{background:var(--chao);border-radius:12px;width:100%;max-width:880px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.modal-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--sup);border-bottom:1px solid var(--linha)}
.modal-cab h2{margin:2px 0 0;font:600 20px/1.25 var(--f-serif)}
.modal-corpo{padding:20px;display:grid;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--chao);padding:10px 16px;border-radius:9px;font-weight:500;z-index:60;box-shadow:var(--sombra);max-width:calc(100% - 32px);width:max-content}
.carregando{color:var(--tinta3);padding:40px 0}

/* protocolos */
.cab-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.situacao{display:flex;align-items:center;gap:8px}
.situacao .inp{width:auto;min-width:200px}
.pr-grade{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@container (max-width:1180px){.pr-grade{grid-template-columns:minmax(0,1fr)}}
.bloco{background:var(--sup);border:1px solid var(--linha);border-radius:10px;padding:16px;display:grid;gap:14px;align-content:start;min-width:0}
.bloco-tit{margin:0;font:600 15px/1.3 var(--f-serif)}
.and-form{display:flex;gap:8px;flex-wrap:wrap}
.and-form .inp{flex:1 1 240px}
.and-form input[type="date"]{flex:0 1 170px}
.and-lista{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--linha)}
.and-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:8px 0 8px 16px;position:relative}
.and-item::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--sup);border:2px solid var(--acento)}
.and-data{font:500 12.5px/1.7 var(--f-mono);color:var(--tinta2);white-space:nowrap;font-variant-numeric:tabular-nums}
.and-txt{overflow-wrap:anywhere;line-height:1.5;padding-top:2px}
.vinc{list-style:none;margin:0;padding:0;display:grid;gap:4px}
/* o protocolo como centro do trabalho: abas internas */
.pr-abas{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--linha);margin:0 0 16px}
.pr-aba{border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;padding:10px 14px;font-weight:600;color:var(--tinta2);display:inline-flex;align-items:baseline;gap:6px}
.pr-aba:hover{color:var(--tinta)}
.pr-aba[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--acento)}
.pr-aba .n{font:500 12px var(--f-mono);color:var(--tinta3)}
.dados-sub{grid-column:1/-1;margin-top:8px;min-width:0}
/* financeiro do protocolo */
.fin-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fin-tile{border:1px solid var(--linha2);border-radius:9px;padding:10px 12px;background:var(--sup2);display:grid;gap:4px;min-width:0}
.fin-tile .rot{margin:0}
.fin-valor{font:600 18px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.fin-valor.pos{color:var(--ok)}.fin-valor.neg{color:var(--pend)}.fin-valor.alerta{color:var(--aviso)}
.fin-tile .inp.fin-valor{padding:2px 8px;margin:0 -8px;width:calc(100% + 16px);background:var(--sup);border-color:var(--linha)}
.fin-form{display:grid;grid-template-columns:150px 160px minmax(0,1fr) 150px auto;gap:8px;align-items:end}
@container (max-width:900px){.fin-form{grid-template-columns:1fr 1fr}.fin-form .fin-desc{grid-column:1/-1}}
.tab-rolagem{overflow-x:auto}
.fin-tab{width:100%;border-collapse:collapse;font-size:14px}
.fin-tab th{text-align:left;font:600 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3);padding:8px;border-bottom:1px solid var(--linha)}
.fin-tab td{padding:8px;border-bottom:1px solid var(--linha2);vertical-align:middle}
.fin-tab .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.fin-tab .dt{font-family:var(--f-mono);white-space:nowrap;color:var(--tinta2)}
.fin-tab tfoot td{font-weight:600;border-bottom:0}
.dados-sub .bloco{border:0;padding:0;background:transparent}
.exig-bloco{display:grid;gap:14px}
.pr-sub{margin:6px 0 0;font:600 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3)}
.link-prots{display:flex;flex-wrap:wrap;gap:4px}
/* barra de botões do protocolo, como no S.R.I. */
.barra-prot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;background:var(--sup);border:1px solid var(--linha);border-radius:10px;margin-bottom:10px}
.bp{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linha);background:var(--sup2);color:var(--tinta);border-radius:7px;padding:7px 14px;font-weight:600;min-height:36px}
.bp svg{width:17px;height:17px;flex:none;color:var(--acento)}
.bp:hover{border-color:var(--acento)}
.bp[aria-pressed="true"]{background:var(--acento-suave);border-color:var(--acento);color:var(--acento-texto)}
.bp .cont{background:var(--pend);color:var(--sobre-pend);border-radius:999px;font:600 11px/1.5 var(--f-mono);padding:0 7px}
.exig-lista{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:exig}
.exig{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:12px 14px;border:1px solid var(--linha2);border-radius:9px;background:var(--sup2)}
.exig.cumprida{opacity:.72}
.exig-num{font:500 13px/1.6 var(--f-mono);color:var(--acento-texto)}
.exig-txt{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.exig-meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--tinta3)}
.exig-acoes{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.exig-form{display:grid;gap:8px}
.exig-form .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@container (max-width:640px){.exig{grid-template-columns:auto minmax(0,1fr)}.exig-acoes{grid-column:1/-1;justify-content:flex-start}}
.ident textarea.inp{grid-column:1/-1}
/* indicadores pessoal e real */
.reg-pilha{display:grid;gap:20px}
.reg-pilha>.ident{margin:0}
.reg-rodape{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--linha)}
/* cadastro compacto (Indicador Pessoal): um só quadro, seções separadas por uma linha */
.reg-pilha.compacta{gap:0;background:var(--sup);border:1px solid var(--linha);border-radius:10px}
.compacta>.ident,.compacta>.bloco{border:0;border-radius:0;background:transparent;padding:10px 14px;margin:0}
.reg-pilha.compacta>*+*{border-top:1px solid var(--linha)}
.compacta .ident.grade12{gap:6px 10px}
.compacta .ident legend,.compacta .bloco-tit{font-size:13.5px;margin-bottom:0}
.compacta .bloco{gap:6px}
.compacta .campo{gap:2px}
.compacta .rot{font-size:10px}
.compacta .inp{padding:3px 8px;font-size:13px;border-radius:6px}
.compacta .inp:not(textarea){height:28px}
.compacta select.inp{padding-right:26px}
.compacta textarea.inp{min-height:30px}
.compacta .btn-ico{width:26px;height:26px;min-height:26px}
.compacta .pr-abas{margin:0 0 4px}
.compacta .pr-aba{padding:5px 10px;font-size:13px}
.compacta .check{font-size:13px}
.compacta .item{padding:7px 10px}
/* grade de 12 colunas para fichas densas, como no S.R.I. */
.ident.grade12,.grade12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px 12px;align-items:end}
.grade12>*{grid-column:span 12}
.grade12>.s2{grid-column:span 2}.grade12>.s3{grid-column:span 3}.grade12>.s4{grid-column:span 4}
.grade12>.s5{grid-column:span 5}.grade12>.s6{grid-column:span 6}.grade12>.s8{grid-column:span 8}
@container (max-width:1100px){.grade12>.s2,.grade12>.s3{grid-column:span 4}.grade12>.s4,.grade12>.s5,.grade12>.s6{grid-column:span 6}.grade12>.s8{grid-column:span 12}}
@container (max-width:640px){.grade12>.s2,.grade12>.s3,.grade12>.s4,.grade12>.s5{grid-column:span 6}.grade12>.s6,.grade12>.s8{grid-column:span 12}}
@container (max-width:420px){.grade12>*{grid-column:span 12!important}}
.linha-inp{display:flex;gap:6px;align-items:center}
.linha-inp>.inp{flex:1 1 auto}
.aviso-campo{color:var(--pend);margin-left:4px}
.aviso-campo:empty{display:none}
.inp[aria-invalid="true"]{border-color:var(--pend)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,max-content));gap:8px 22px;align-content:start}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--acento);margin:0}
.sub-abas{margin:0 0 12px}
.vinc-linha{display:grid;grid-template-columns:minmax(0,1fr) 210px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linha2)}
.vinc-linha:last-child{border-bottom:0}
.vinc-nome{border:0;background:transparent;text-align:left;padding:4px 0;font-weight:600;color:var(--tinta);min-width:0;overflow-wrap:anywhere}
.vinc-nome:hover{color:var(--acento-texto);text-decoration:underline}
.vinc-nome small{display:block;font:12px/1.5 var(--f-mono);color:var(--tinta3);font-weight:400}
.vinc-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vinc-add select,.vinc-add .inp{flex:1 1 200px;width:auto}
/* janela Dados: lista do que foi adicionado, uma linha, e os botões Adicionar e Excluir */
.dl{display:grid}
.dl-lista{display:grid;gap:4px;padding-bottom:12px;border-bottom:1px solid var(--linha)}
.dl-linha{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--linha2);background:var(--sup);border-radius:7px;padding:8px 12px}
.dl-linha:hover{border-color:var(--tinta3)}
.dl-linha[aria-pressed="true"]{background:var(--acento-suave);border-color:var(--acento)}
.dl-nome{font-weight:600;min-width:0;overflow-wrap:anywhere}
.dl-linha small{color:var(--tinta3);font-size:12.5px}
.dl-linha .chip{margin-left:auto}
.dl-bts{display:flex;gap:8px;padding-top:12px}
/* janela Arquivos: lista à esquerda, visualização à direita, ocupando a janela do protocolo */
.modal.arq{padding:10px}
.modal.arq .modal-painel{height:100%;display:flex;flex-direction:column}
.modal.arq .modal-corpo{flex:1;min-height:0;padding:14px;display:block}
.arq-grade{height:100%;min-height:320px;display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:14px;border-radius:8px;outline:2px dashed transparent;outline-offset:4px}
.arq-grade.soltar{outline-color:var(--acento)}
.arq-grade>.dl{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.arq-grade>.dl>.dl-lista{flex:0 1 auto;min-height:0;overflow:auto}
.arq-grade>.dl>.dl-bts{flex:none}
.dl-linha.aberto .dl-nome{color:var(--acento-texto)}
.dl-linha.aberto{box-shadow:inset 3px 0 0 var(--acento)}
.arq-visor{min-height:0;display:flex;flex-direction:column;border:1px solid var(--linha);border-radius:8px;background:var(--sup2);overflow:hidden}
.arq-visor-cab{flex:none;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--linha);background:var(--sup)}
.arq-visor-nome{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arq-visor-corpo{flex:1;min-height:0;overflow:auto;padding:16px}
.arq-visor-corpo.sem-margem{padding:0;overflow:hidden}
.arq-visor>.arq-vazio{margin:auto}
.arq-vazio{color:var(--tinta3);text-align:center;padding:32px 16px;margin:0}
.arq-pdf{display:block;width:100%;height:100%;border:0}
.arq-paginas{display:grid;gap:12px;justify-items:center}
.arq-pagina{display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.arq-img,.arq-video{display:block;max-width:100%;margin:0 auto}
.arq-texto{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.5 var(--f-mono);color:var(--tinta)}
.arq-doc{background:#fff;color:#1b1b1b;max-width:820px;margin:0 auto;padding:40px 48px;box-shadow:0 1px 4px rgba(0,0,0,.2);font:15px/1.6 var(--f-serif)}
.arq-doc img{max-width:100%;height:auto}
.arq-doc table{border-collapse:collapse;margin:8px 0}
.arq-doc td,.arq-doc th{border:1px solid #bbb;padding:4px 6px}
.arq-abas{margin:0 0 8px}
.arq-planilha{overflow:auto}
.arq-planilha table{border-collapse:collapse;background:#fff;color:#1b1b1b;font:12.5px/1.4 var(--f-ui)}
.arq-planilha td{border:1px solid #d3d3d3;padding:3px 8px;white-space:nowrap}
/* Minutas: editor com a folha do documento */
.min-editor .arq-visor-cab{flex-wrap:wrap}
.min-titulo{flex:1 1 220px;min-width:0;font-weight:600;height:32px}
.min-barra{flex:none;display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid var(--linha);background:var(--sup)}
.min-fmt{width:30px;height:28px;display:grid;place-items:center;border:0;border-radius:5px;background:transparent;color:var(--tinta);font:15px/1 var(--f-serif)}
.min-fmt:hover{background:var(--sup2)}
.min-fmt svg{width:16px;height:16px}
.min-sep{width:1px;height:18px;background:var(--linha);margin:0 6px}
.min-faltam{margin-left:auto;font-size:12px;color:var(--aviso);font-weight:600}
.min-corpo{background:var(--linha2)}
.min-folha{background:#fff;color:#111;max-width:21cm;min-height:100%;margin:0 auto;padding:2.2cm 2cm 2cm 2.5cm;box-shadow:0 1px 4px rgba(0,0,0,.25);font:12pt/1.5 "Times New Roman",Times,serif;outline:none}
.min-folha p{margin:0 0 6pt}
.min-folha p.t{text-align:justify;text-indent:1.25cm}
.min-folha ul,.min-folha ol{margin:0 0 6pt;padding-left:1cm;text-align:justify}
.min-folha table{border-collapse:collapse;width:100%;font-size:10pt;margin:0 0 6pt}
.min-folha td,.min-folha th{border:1px solid #808080;padding:2pt 4pt;vertical-align:top}
.min-folha .quebra{border-top:1px dashed #9aa;margin:18pt -2cm 18pt -2.5cm;height:0}
.campo-vazio{background:#fff0a0;border-radius:2px}
.min-modelos section+section{margin-top:14px}
.min-modelos h3{margin:0 0 6px;font:600 12px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3)}
.min-modelos-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.min-modelo{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--linha);background:var(--sup);border-radius:8px;padding:10px 12px;font-weight:600;color:var(--tinta)}
.min-modelo:hover{border-color:var(--acento);background:var(--acento-suave)}
.min-modelo svg{width:20px;height:20px;flex:none;color:var(--acento)}
@container (max-width:720px){
  .min-folha{padding:1cm}
  .arq-grade{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,auto) minmax(300px,1fr)}
  .arq-grade>.dl{max-height:38vh}
  .arq-doc{padding:20px}
}
.vinc-linha.tab-linha{grid-template-columns:minmax(0,1fr) 170px auto}
@container (max-width:640px){.vinc-linha.tab-linha{grid-template-columns:minmax(0,1fr) auto}.vinc-linha.tab-linha>.inp{grid-column:1/-1}}
@container (max-width:640px){.vinc-linha{grid-template-columns:minmax(0,1fr) auto}.vinc-linha select{grid-column:1/-1;grid-row:2}}
.ident .largo{grid-column:1/-1}
</style>
</head>

/* Botão de duas etapas: o primeiro clique pede confirmação, o segundo executa. */

  const antes = [...b.childNodes], rotulo = b.getAttribute('aria-label');

function ajustarOpcoes(q) {

    const flags = Object.fromEntries((q.opcoes || []).map(o => [o.id, o.pendencia]));

/* Percorre a árvore numerando as perguntas: 1, 2, 2.1, 2.1.1… (seções não recebem número). */
function indexar(perguntas) {
  const mapa = new Map(), ordem = [];
  let n = 0;
  (function vis(lista, pai, prefixo, secao) {
    let k = 0;
    for (const no of lista) {
      if (no.tipo === 'secao') {
        mapa.set(no.id, { no, pai: null, num: '', secao: no });
        ordem.push(no.id);
        vis(no.filhos, null, '', no);
        continue;
      }
      const num = prefixo ? `${prefixo}.${++k}` : String(++n);
      mapa.set(no.id, { no, pai, num, secao });
      ordem.push(no.id);
      vis(no.filhos, no, num, secao);
    }
  })(perguntas, null, '', null);
  return { mapa, ordem };
}
const selecionadas = (q, r) => { const v = r && r.v; return Array.isArray(v) ? v : (v ? [v] : []); };
function visivel(info, idx, resp) {
  let cur = info;
  while (cur && cur.pai) {
    const pai = cur.pai, q = cur.no;
    if (ehEscolha(pai.tipo) && q.mostrarSe && q.mostrarSe.length) {
      const sel = selecionadas(pai, resp[pai.id]);
      if (!sel.some(x => q.mostrarSe.includes(x))) return false;
    }
    cur = idx.mapa.get(pai.id);
  }
  return true;
}
function respondida(q, r) {
  const v = r && r.v;
  return Array.isArray(v) ? v.length > 0 : (v != null && String(v).trim() !== '');
}
const opcoesMarcadas = (q, r) => { const ids = selecionadas(q, r); return q.opcoes.filter(o => ids.includes(o.id)); };
const temPendencia = (q, r) => ehEscolha(q.tipo) && opcoesMarcadas(q, r).some(o => o.pendencia);
function textoResposta(q, r) {
  if (!respondida(q, r)) return '';
  if (ehEscolha(q.tipo)) return opcoesMarcadas(q, r).map(o => o.rotulo).join('; ');
  if (q.tipo === 'data') return fmtData(r.v);
  return String(r.v);
}
function estatisticas(modelo, resp) {
  const idx = indexar(modelo.perguntas);
  let total = 0, feitas = 0;
  const pendencias = [], abertas = [];
  for (const id of idx.ordem) {
    const info = idx.mapa.get(id);
    if (info.no.tipo === 'secao' || !visivel(info, idx, resp)) continue;
    total++;
    const r = resp[id];
    if (respondida(info.no, r)) { feitas++; if (temPendencia(info.no, r)) pendencias.push(info); }
    else abertas.push(info);
  }
  return { idx, total, feitas, pendencias, abertas };
}
function contarPerguntas(perguntas) {
  let n = 0, s = 0;
  (function vis(l) { for (const x of l) { if (x.tipo === 'secao') s++; else n++; vis(x.filhos); } })(perguntas);
  return { n, s };
}
function semear(dados) {
  const base = BIB.modelos[0];
  const m = normalizarModelo(clone(base));
  dados.modelos[m.id] = m;
  const ex = BIB.exemplo;
  if (ex) {
    const a = novaAnalise(m, ex.ident);
    a.id = ex.id; a.respostas = clone(ex.respostas); a.exemplo = true;
    if (ex.protocolo) {

      dados.protocolos[p.id] = p;
      a.protocoloId = p.id;
    }
    dados.analises[a.id] = a;

const NORMALIZAR = { tabelas: t => normalizarTabela(t), modelos: m => normalizarModelo(m), analises: a => normalizarAnalise(a), protocolos: p => normalizarProtocolo(p), pessoas: p => normalizarPessoa(p), imoveis: i => normalizarImovel(i) };

/* ---------- armazenamento: db do artifact quando disponível, senão este navegador ---------- */
const Store = {
  modo: 'carregando', emArtifact: false, db: null,
  dados: { modelos: {}, analises: {}, protocolos: {}, pessoas: {}, imoveis: {}, tabelas: {} },
  revs: {}, timers: {}, cadeias: {}, pendentes: new Set(),
  aoRemoto: null, aoStatus: null,
  async iniciar() {
    this.emArtifact = !!(window.claude && typeof window.claude.use === 'function');
    let db = null;
    if (this.emArtifact) { try { db = await window.claude.use('db'); } catch (e) { db = null; } }
    if (db) { this.db = db; this.modo = 'db'; await this.iniciarDb(); }
    else this.iniciarLocal();
    this.status();
  },
  iniciarLocal() {
    let bruto = null, ok = true;
    try { bruto = localStorage.getItem(LS_DADOS); } catch (e) { ok = false; }
    this.modo = ok ? 'local' : 'memoria';
    let d = null;
    if (bruto) { try { d = JSON.parse(bruto); } catch (e) { d = null; } }
    if (d && d.modelos && d.analises) {
      for (const m of Object.values(d.modelos)) { const x = normalizarModelo(m); this.dados.modelos[x.id] = x; }
      for (const a of Object.values(d.analises)) { const x = normalizarAnalise(a); this.dados.analises[x.id] = x; }
      for (const p of Object.values(d.protocolos || {})) { const x = normalizarProtocolo(p); this.dados.protocolos[x.id] = x; }
      for (const p of Object.values(d.pessoas || {})) { const x = normalizarPessoa(p); this.dados.pessoas[x.id] = x; }
      for (const i of Object.values(d.imoveis || {})) { const x = normalizarImovel(i); this.dados.imoveis[x.id] = x; }
      for (const t of Object.values(d.tabelas || {})) { const x = normalizarTabela(t); this.dados.tabelas[x.id] = x; }
    } else {
      semear(this.dados);
      this.salvarLocal();
    }
  },
  salvarLocal() {
    if (this.modo !== 'local') return;
    try { localStorage.setItem(LS_DADOS, JSON.stringify(this.dados)); }
    catch (e) { toast('Não foi possível salvar neste navegador. Exporte um backup para não perder os dados.'); }
  },
  iniciarDb() {
    return new Promise(resolve => {
      let faltam = 6;
      const pronto = () => { if (--faltam <= 0) resolve(); };
      setTimeout(resolve, 9000);
      for (const col of ['modelos', 'analises', 'protocolos', 'pessoas', 'imoveis', 'tabelas']) {
        let primeira = true;
        this.db.collection(col).onSnapshot(snap => {
          this.aplicarSnap(col, snap, !primeira);
          if (primeira) { primeira = false; pronto(); }
        }, () => {
          toast('A sincronização foi interrompida. Recarregue a página para voltar a salvar.');
          if (primeira) { primeira = false; pronto(); }
        });
      }
    });
  },
  aplicarSnap(col, snap, avisar) {
    const mudados = [];
    for (const ch of snap.docChanges()) {
      const id = ch.doc.id, chave = col + '/' + id;
      if (this.pendentes.has(chave)) continue; // há edição local ainda não gravada: ela prevalece
      if (ch.type === 'removed') {
        if (this.dados[col][id]) { delete this.dados[col][id]; mudados.push(id); }
        continue;
      }
      const d = ch.doc.data();
      if (!d || (d._rev && d._rev === this.revs[chave])) continue; // eco da própria gravação
      const obj = Object.assign(clone(d), { id });
      this.dados[col][id] = NORMALIZAR[col](obj);
      mudados.push(id);
    }
    if (avisar && mudados.length && this.aoRemoto) this.aoRemoto(col, mudados);
  },
  put(col, obj, atraso = 700) {
    obj.atualizadoEm = agora();
    this.dados[col][obj.id] = obj;
    if (this.aoMudar) this.aoMudar(col);
    const chave = col + '/' + obj.id;
    this.pendentes.add(chave);
    clearTimeout(this.timers[chave]);
    this.timers[chave] = setTimeout(() => { this.timers[chave] = null; this.gravar(col, obj.id); }, atraso);
    this.status();
  },
  gravar(col, id, tentativa = 0) {
    const chave = col + '/' + id;
    if (this.modo !== 'db') {
      this.pendentes.delete(chave);
      this.salvarLocal();
      this.status();
      return Promise.resolve();
    }
    const antes = this.cadeias[chave] || Promise.resolve();
    const p = antes.then(async () => {
      const obj = this.dados[col][id];
      if (!obj) return;
      const rev = uid('r');
      this.revs[chave] = rev;
      await this.db.collection(col).doc(id).set(Object.assign(clone(obj), { _rev: rev }));
    }).catch(e => {
      const c = e && e.code;
      if ((c === 'unavailable' || c === 'resource_exhausted') && tentativa < 1) {
        this.pendentes.add(chave);
        setTimeout(() => this.gravar(col, id, tentativa + 1), 1500 + Math.random() * 1500);
      } else this.erro(e);
    }).finally(() => {
      if (this.cadeias[chave] === p) {
        delete this.cadeias[chave];
        if (!this.timers[chave]) this.pendentes.delete(chave);
      }
      this.status();
    });
    this.cadeias[chave] = p;
    return p;
  },
  async remover(col, id) {
    const chave = col + '/' + id;
    clearTimeout(this.timers[chave]);
    this.timers[chave] = null;
    delete this.dados[col][id];
    if (this.aoMudar) this.aoMudar(col);
    if (this.modo === 'db') {
      try { await (this.cadeias[chave] || Promise.resolve()); await this.db.collection(col).doc(id).delete(); }
      catch (e) { this.erro(e); }
    } else this.salvarLocal();
    this.pendentes.delete(chave);
    this.status();
  },
  descarregar() {
    for (const [chave, t] of Object.entries(this.timers)) {
      if (!t) continue;
      clearTimeout(t);
      this.timers[chave] = null;
      const i = chave.indexOf('/');
      this.gravar(chave.slice(0, i), chave.slice(i + 1));
    }
  },
  erro(e) {
    const c = e && e.code;
    if (c === 'invalid_argument') toast('Você não tem permissão para salvar alterações aqui.');
    else if (c === 'quota_exceeded') toast('Limite de armazenamento atingido. Exporte um backup e exclua análises antigas.');
    else if (c === 'resource_exhausted') toast('Muitas gravações seguidas. Aguarde alguns segundos e continue.');
    else toast('Não foi possível salvar: ' + ((e && e.message) || 'erro desconhecido'));
  },
  status() {
    let estado = 'ok', txt;
    if (this.modo === 'carregando') { estado = 'carregando'; txt = 'Carregando…'; }
    else if (this.pendentes.size) { estado = 'salvando'; txt = 'Salvando…'; }
    else if (this.modo === 'db') txt = 'Salvo e sincronizado';
    else if (this.modo === 'local') txt = this.emArtifact ? 'Salvo só neste navegador' : 'Salvo neste navegador';
    else { estado = 'aviso'; txt = 'Sem armazenamento: exporte um backup'; }
    if (this.aoStatus) this.aoStatus(estado, txt);
  }
};

/* ---------- questionário (usado na análise e na visualização) ---------- */
function montarQuestionario(modelo, resp, aoMudar) {
  const idx = indexar(modelo.perguntas);
  const els = new Map();
  const raiz = h('div', { class: 'quest' });

  function definir(q, r) {
    const vazio = !respondida(q, r) && !(r && r.obs);
    if (vazio) delete resp[q.id]; else resp[q.id] = r;
  }
  function clicar(q, o) {
    const r = Object.assign({}, resp[q.id] || {});
    if (q.tipo === 'multipla') {
      const cur = Array.isArray(r.v) ? r.v.slice() : [];
      const i = cur.indexOf(o.id);
      if (i >= 0) cur.splice(i, 1); else cur.push(o.id);
      r.v = cur;
    } else r.v = r.v === o.id ? null : o.id;
    definir(q, r);
    atualizar();
    aoMudar();
  }
  function cartao(q) {
    const info = idx.mapa.get(q.id);
    const r0 = resp[q.id] || {};
    const e = { botoes: new Map() };
    const carimbo = h('span', { class: 'carimbo', hidden: true }, 'Pendência');
    const cab = h('div', { class: 'q-cab' },
      h('span', { class: 'q-estado', 'aria-hidden': 'true' }),
      h('span', { class: 'q-num' }, info.num),
      h('p', { class: 'q-txt', id: 'qt-' + q.id }, q.texto || 'Pergunta sem texto'),
      carimbo);
    const corpo = h('div', { class: 'q-corpo' });
    if (q.fundamento) corpo.append(h('p', { class: 'q-fund' }, q.fundamento));
    if (ehEscolha(q.tipo)) {
      const grupo = h('div', { class: 'q-ops', role: 'group', 'aria-labelledby': 'qt-' + q.id });
      for (const o of q.opcoes) {
        const b = h('button', {
          type: 'button', class: 'op' + (o.pendencia ? ' op-pend' : ''), 'data-multi': q.tipo === 'multipla',
          'aria-pressed': 'false', onclick: () => clicar(q, o)
        }, o.rotulo || '(sem rótulo)');
        e.botoes.set(o.id, b);
        grupo.append(b);
      }
      corpo.append(grupo);
    } else if (q.tipo === 'texto') {
      const t = h('textarea', { class: 'inp', id: 'r-' + q.id, rows: '2', 'aria-labelledby': 'qt-' + q.id, placeholder: 'Resposta', value: r0.v || '' });
      t.addEventListener('input', () => { autoAltura(t); definir(q, Object.assign({}, resp[q.id] || {}, { v: t.value })); atualizar(); aoMudar(); });
      corpo.append(t);
      requestAnimationFrame(() => autoAltura(t));
    } else if (q.tipo === 'data') {
      const i = h('input', { class: 'inp', type: 'date', id: 'r-' + q.id, style: 'max-width:200px', 'aria-labelledby': 'qt-' + q.id, value: r0.v || '' });
      i.addEventListener('change', () => { definir(q, Object.assign({}, resp[q.id] || {}, { v: i.value })); atualizar(); aoMudar(); });
      corpo.append(i);
    }
    const extra = h('div', { class: 'q-extra' });
    let ajuda = null;
    if (q.ajuda) {
      ajuda = h('p', { class: 'q-ajuda', hidden: true, id: 'qa-' + q.id }, q.ajuda);
      const b = btn('Orientação', { icone: 'info', fant: true, sm: true });
      b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-controls', idJ('qa-' + q.id));
      b.onclick = () => { ajuda.hidden = !ajuda.hidden; b.setAttribute('aria-expanded', String(!ajuda.hidden)); };
      extra.append(b);
    }
    const obs = h('textarea', { class: 'inp', id: 'o-' + q.id, rows: '2', placeholder: 'Observação sobre este item (aparece no relatório)', 'aria-label': 'Observação', value: r0.obs || '' });
    const obsBox = h('div', { class: 'campo', hidden: !r0.obs }, obs);
    obs.addEventListener('input', () => { autoAltura(obs); definir(q, Object.assign({}, resp[q.id] || {}, { obs: obs.value })); aoMudar(); });
    const bObs = btn(r0.obs ? 'Observação' : 'Adicionar observação', { icone: 'nota', fant: true, sm: true });
    bObs.setAttribute('aria-expanded', String(!!r0.obs));
    bObs.onclick = () => { obsBox.hidden = !obsBox.hidden; bObs.setAttribute('aria-expanded', String(!obsBox.hidden)); if (!obsBox.hidden) { autoAltura(obs); obs.focus(); } };
    if (r0.obs) requestAnimationFrame(() => autoAltura(obs));
    extra.append(bObs);
    corpo.append(extra);
    if (ajuda) corpo.append(ajuda);
    corpo.append(obsBox);
    const prov = h('p', { class: 'q-prov', hidden: true }, h('strong', null, 'Providência: '), q.providencia || 'Registre na observação a providência necessária.');
    corpo.append(prov);
    const card = h('article', { class: 'q', id: 'q-' + q.id, 'aria-labelledby': 'qt-' + q.id }, cab, corpo);
    if (q.filhos.length) {
      const fb = h('div', { class: 'q-filhos' });
      construir(q.filhos, fb);
      card.append(fb);
    }
    Object.assign(e, { card, carimbo, prov });
    els.set(q.id, e);
    return card;
  }
  function construir(lista, destino) {
    for (const no of lista) {
      if (no.tipo === 'secao') {
        const corpo = h('div', { class: 'quest' });
        const sec = h('section', { class: 'q-sec', 'aria-labelledby': 'st-' + no.id },
          h('header', { class: 'q-sec-cab' },
            h('h2', { class: 'q-sec-tit', id: 'st-' + no.id }, no.texto || 'Seção sem título'),
            no.fundamento ? h('span', { class: 'q-sec-ref' }, no.fundamento) : null),
          corpo);
        els.set(no.id, { card: sec, secao: true });
        construir(no.filhos, corpo);
        destino.append(sec);
      } else destino.append(cartao(no));
    }
  }
  construir(modelo.perguntas, raiz);
  if (!modelo.perguntas.length) raiz.append(h('p', { class: 'dica' }, 'Este checklist ainda não tem perguntas.'));

  let filtro = 'todas';
  function atualizar(novoFiltro) {
    if (novoFiltro) filtro = novoFiltro;
    const casa = {}, mostra = {};
    for (const id of idx.ordem) {
      const info = idx.mapa.get(id), e = els.get(id);
      if (info.no.tipo === 'secao') continue;
      const q = info.no, r = resp[id];
      const vis = visivel(info, idx, resp);
      const feita = respondida(q, r), pend = feita && temPendencia(q, r);
      e.card.classList.toggle('respondida', feita);
      e.card.classList.toggle('pendente', pend);
      e.carimbo.hidden = !pend;
      e.prov.hidden = !pend;
      const sel = selecionadas(q, r);
      for (const [oid, b] of e.botoes) b.setAttribute('aria-pressed', String(sel.includes(oid)));
      casa[id] = vis && (filtro === 'todas' || (filtro === 'abertas' && !feita) || (filtro === 'pendencias' && pend));
      mostra[id] = vis;
    }
    // de baixo para cima: um item fora do filtro continua visível (compacto) se algum descendente estiver no filtro
    const exibe = {};
    for (let i = idx.ordem.length - 1; i >= 0; i--) {
      const id = idx.ordem[i], info = idx.mapa.get(id), e = els.get(id);
      const desc = info.no.filhos.some(f => exibe[f.id]);
      if (info.no.tipo === 'secao') { exibe[id] = desc; e.card.hidden = !desc; continue; }
      exibe[id] = mostra[id] && (casa[id] || desc);
      e.card.hidden = !exibe[id];
      e.card.classList.toggle('compacto', exibe[id] && !casa[id]);
    }
  }
  function irPara(id) {
    const e = els.get(id);
    if (!e) return;
    if (e.card.hidden) atualizar('todas');
    e.card.scrollIntoView({ block: 'center', behavior: reduzMov ? 'auto' : 'smooth' });
    e.card.classList.add('destaque');
    setTimeout(() => e.card.classList.remove('destaque'), 1600);
  }
  atualizar();
  return { el: raiz, atualizar, irPara, filtroAtual: () => filtro };
}

/* ---------- arquivos anexados ao protocolo ----------
   Na página publicada o conteúdo vai para o armazenamento de arquivos da própria página (assets);
   no index.html aberto no navegador, para o IndexedDB deste navegador. O protocolo guarda só a lista. */
const ASSET_DIRETO = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', mp4: 'video/mp4', webm: 'video/webm' };
const MB = 1024 * 1024;
let assetsP = null;
const assetsNs = () => {
  if (!Store.emArtifact) return Promise.resolve(null);
  if (!assetsP) assetsP = window.claude.use('assets').catch(() => null);
  return assetsP;
};
function idbArquivos(modo, fn) {
  return new Promise((ok, falha) => {
    const r = indexedDB.open('rurb-arquivos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('arquivos');
    r.onerror = () => falha(r.error);
    r.onsuccess = () => {
      const tx = r.result.transaction('arquivos', modo);
      const req = fn(tx.objectStore('arquivos'));
      tx.oncomplete = () => { r.result.close(); ok(req.result); };
      tx.onerror = tx.onabort = () => { r.result.close(); falha(tx.error); };
    };
  });

const lerBase64 = f => new Promise((ok, falha) => {

  fr.onerror = () => falha(fr.error);
  fr.readAsDataURL(f);
});
const Arquivos = {
  // PDF, imagens e vídeos vão como estão; os outros tipos (Word, Excel, ZIP…) vão dentro de um JSON
  async guardar(f) {
    if (Store.emArtifact) {
      const as = await assetsNs();
      if (!as) throw { code: 'sem_armazenamento' };
      const direto = ASSET_DIRETO[(f.name.split('.').pop() || '').toLowerCase()];
      if (direto) {
        if (f.size > 20 * MB) throw { code: 'too_large' };
        return { ref: (await as.upload(f, { type: direto })).id, via: 'asset', embrulhado: false };
      }
      if (f.size > 14.5 * MB) throw { code: 'too_large' };
      const caixa = new Blob([JSON.stringify({ nome: f.name, tipo: f.type, dados: await lerBase64(f) })], { type: 'application/json' });
      return { ref: (await as.upload(caixa, { type: 'application/json' })).id, via: 'asset', embrulhado: true };
    }
    if (f.size > 50 * MB) throw { code: 'too_large' };
    const ref = uid('f');
    await idbArquivos('readwrite', st => st.put(f, ref));
    return { ref, via: 'local', embrulhado: false };
  },
  async obter(a) {
    if (a.via === 'local') return idbArquivos('readonly', st => st.get(a.ref));
    const r = await fetch('/_blob/' + a.ref);
    if (!r.ok) return null;
    if (!a.embrulhado) return r.blob();
    const c = JSON.parse(await r.text());
    const bin = atob(c.dados), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

  },
  async apagar(a) {
    if (a.via === 'local') return idbArquivos('readwrite', st => st.delete(a.ref));

  }

const tamanhoArquivo = n => n < 1024 ? n + ' B' : n < MB ? Math.round(n / 1024) + ' KB' : (n / MB).toFixed(1).replace('.', ',') + ' MB';
function erroArquivo(e, nome) {
  const c = e && e.code;

  if (c === 'sem_armazenamento' || c === 'not_granted' || c === 'capability_disabled') return 'Esta visualização não permite guardar arquivos.';
  if (c === 'quota_or_state') return 'O espaço para arquivos está cheio. Exclua arquivos que não precisa mais.';
  if (c === 'rate_limited') return 'Muitos envios seguidos. Aguarde um pouco e tente de novo.';

async function baixarArquivo(a) {
  let blob = null;
  try { blob = await Arquivos.obter(a); } catch (e) { blob = null; }
  if (!blob) { toast(a.via === 'local' ? 'Este arquivo foi anexado em outro navegador ou computador.' : 'Não foi possível abrir o arquivo.'); return; }
  if (Store.emArtifact) { baixar(a.nome, blob); return; }

  const visor = h('section', { class: 'arq-visor', 'aria-label': 'Visualização' });

  const vis = visualizador(visor);
  const entrada = h('input', { type: 'file', multiple: true, hidden: true });
  let sel = null, aberto = null, enviando = 0;
  const abrir = a => { sel = aberto = a.id; desenhar(); vis.abrir(a); };
  const desenhar = () => {
    if (!p.arquivos.some(a => a.id === sel)) sel = null;
    if (aberto && !p.arquivos.some(a => a.id === aberto)) { aberto = null; vis.vazio(); }
    const linhas = p.arquivos.map(a => h('button', {
      type: 'button', class: 'dl-linha' + (a.id === aberto ? ' aberto' : ''), 'aria-pressed': String(a.id === sel), title: 'Dois cliques abrem o arquivo',

    const bAdd = btn(enviando ? 'Enviando…' : 'Adicionar', { icone: 'mais', prim: true, disabled: enviando > 0, onclick: () => entrada.click() });
    const bExcluir = btn('Excluir', { icone: 'lixo', perigo: true, disabled: !sel || enviando > 0, onclick: ev => armar(ev.currentTarget, async () => {
      const a = p.arquivos.find(x => x.id === sel);

    lado.replaceChildren(h('div', { class: 'dl-lista' }, linhas.length ? linhas : h('p', { class: 'dica' }, 'Nenhum arquivo.')),

function crc32(u8) {

  c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = tab[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

    loc.setUint16(10, 0, true); loc.setUint16(12, 0x21, true); loc.setUint32(14, crc, true);
    loc.setUint32(18, dados.length, true); loc.setUint32(22, dados.length, true); loc.setUint16(26, nome.length, true); loc.setUint16(28, 0, true);
    const cen = new DataView(new ArrayBuffer(46));

    central.push(new Uint8Array(cen.buffer), nome);
    off += 30 + nome.length + dados.length;
  }
  const tamCentral = central.reduce((s, x) => s + x.length, 0);

/* consulta de CEP (ViaCEP); só no arquivo aberto no navegador, a página publicada não acessa outros sites */
async function buscarCep(end, pref, cep, depois) {
  const jan = J;
  const d = String(cep).replace(/\D/g, '');
  if (d.length !== 8) { toast('Digite os 8 números do CEP.'); return; }
  try {
    const r = await fetch('https://viacep.com.br/ws/' + d + '/json/');
    const j = await r.json();
    if (j.erro) { toast('CEP não encontrado.'); return; }
    const partes = String(j.logradouro || '').split(' ');
    const tipo = TIPOS_LOGRADOURO.find(t => norm(t) === norm(partes[0]));
    Object.assign(end, {
      tipo: tipo || end.tipo, logradouro: tipo ? partes.slice(1).join(' ') : (j.logradouro || end.logradouro),
      bairro: j.bairro || end.bairro, municipio: j.localidade ? j.localidade + '/' + j.uf : end.municipio,
      complemento: end.complemento || j.complemento || ''
    });
    if (!jan.el.isConnected) return;
    usar(jan);
    depois();
    toast('Endereço preenchido pelo CEP.');
  } catch (e) { toast('Não foi possível consultar o CEP agora. Preencha o endereço manualmente.'); }
}

async function baixar(nome, conteudo) {
  if (Store.emArtifact) {
    if (!downloadsP) downloadsP = window.claude.use('downloads').catch(() => null);
    const dl = await downloadsP;
    if (dl) {
      try { await dl.save({ filename: nome, data: conteudo }); toast('Arquivo salvo: ' + nome); }
      catch (e) {
        if (e && e.code === 'declined') return;
        if (e && e.code === 'rate_limited') { toast('Já há um download aguardando confirmação.'); return; }
        if (conteudo instanceof Blob) { toast(e && e.code === 'rejected_extension' ? 'Este tipo de arquivo não pode ser baixado nesta visualização.' : 'Não foi possível baixar o arquivo.'); return; }
        mostrarTexto(nome, conteudo, 'Não foi possível baixar o arquivo aqui. Copie o conteúdo abaixo e salve-o com o nome ' + nome + '.');
      }
      return;
    }
    if (conteudo instanceof Blob) { toast('Downloads não estão disponíveis nesta visualização.'); return; }
    mostrarTexto(nome, conteudo, 'Downloads não estão disponíveis nesta visualização. Copie o conteúdo abaixo e salve-o com o nome ' + nome + '.');
    return;
  }
  const tipo = nome.endsWith('.json') ? 'application/json' : 'text/html';
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo + ';charset=utf-8' }));
  const a = h('a', { href: url, download: nome });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function acompanhar(alvo, ev, mover) {

  const fim = () => {
    alvo.removeEventListener('pointermove', mover);

function arrastar(j, ev) {

    if (dir.includes('e')) W = Math.min(Math.max(W0 + dx, MIN_L), a.width - L0);
    if (dir.includes('s')) H = Math.min(Math.max(H0 + dy, MIN_A), a.height - T0);
    if (dir.includes('w')) { W = Math.min(Math.max(W0 - dx, MIN_L), L0 + W0); L = L0 + W0 - W; }
    if (dir.includes('n')) { H = Math.min(Math.max(H0 - dy, MIN_A), T0 + H0); T = T0 + H0 - H; }

    Object.assign(j.el.style, { left: (i % cols) * w + 'px', top: Math.floor(i / cols) * alt + 'px', width: w + 'px', height: alt + 'px' });

    if (typeof v === 'boolean') c.checked = v; else c.value = v;
  });
  j.corpo.scrollTop = y;
}
// quem está com o foco num campo ou botão da janela não perde o que está fazendo: ela espera o foco sair
const emUso = j => { const a = document.activeElement; return j.el.contains(a) && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(a.tagName); };
function atualizarOutras() {
  const cols = [...mudados];
  mudados.clear();
  atualizarJanelas(cols);
}
// sem cols: todas as janelas (carga inicial, importação, alterações vindas de outro aparelho)
function atualizarJanelas(cols) {
  const antes = J;
  for (const j of janelas) {
    if (cols && !DEPENDE[j.ui.aba].some(c => cols.includes(c))) continue;
    if (emUso(j)) { usar(j); renderItens(); j.adiado = true; }
    else redesenhar(j);
  }
  usar(antes && antes.el.isConnected ? antes : null);
}

/* ---------- ligação inicial ---------- */
$('#lista-nacionalidades').append(...NACIONALIDADES.map(n => h('option', { value: n })));
/* menus do topo (Cadastros, Recepção): abrem ao passar o mouse, com toque ou pelo teclado */
const menusTopo = [...document.querySelectorAll('.mb-item')].filter(it => it.querySelector('.mb-sub'));
/* mantém o submenu dentro da tela (celular): encosta à direita do botão se passar da borda */
function posicionarSub(it) {
  const sub = it.querySelector('.mb-sub');
  sub.style.left = ''; sub.style.right = '';
  const r = sub.getBoundingClientRect();
  if (!r.width) return;
  if (r.right > innerWidth - 8) {
    sub.style.left = 'auto'; sub.style.right = '0';
    if (sub.getBoundingClientRect().left < 8) { sub.style.right = 'auto'; sub.style.left = (8 - it.getBoundingClientRect().left) + 'px'; }
  }
}
function abrirGrupo(g, sim, focar) {
  const gb = g.querySelector('.mb-op-sub'), sub2 = g.querySelector('.mb-sub2');
  g.classList.toggle('aberto', sim);
  gb.setAttribute('aria-expanded', String(sim));
  if (sim) { posicionarSub2(g); if (focar) sub2.querySelector('.mb-op').focus(); }
}
/* abre o submenu em cascata à esquerda quando não cabe à direita */
function posicionarSub2(g) {
  const sub2 = g.querySelector('.mb-sub2');
  sub2.classList.remove('esq');
  if (getComputedStyle(sub2).position === 'absolute' && sub2.getBoundingClientRect().right > innerWidth - 8) sub2.classList.add('esq');
}
function abrirMenu(it, sim, focar) {
  it.classList.toggle('aberto', sim);
  if (!sim) for (const g of it.querySelectorAll('.mb-grupo')) abrirGrupo(g, false);
  if (sim) { it.classList.remove('suprimir'); posicionarSub(it); }
  it.querySelector('.mb-btn').setAttribute('aria-expanded', String(sim));
  if (sim && focar) it.querySelector('.mb-op').focus();
}
const fecharMenus = exceto => { for (const it of menusTopo) if (it !== exceto) abrirMenu(it, false); };
for (const it of menusTopo) {
  const b = it.querySelector('.mb-btn');
  b.addEventListener('click', () => { const abrir = !it.classList.contains('aberto'); fecharMenus(it); abrirMenu(it, abrir); });
  b.addEventListener('keydown', ev => { if (ev.key === 'ArrowDown') { ev.preventDefault(); ev.stopPropagation(); fecharMenus(it); abrirMenu(it, true, true); } });
  it.addEventListener('keydown', ev => {
    const nivel = document.activeElement.closest('.mb-sub2, .mb-sub');
    const ops = [...it.querySelectorAll('.mb-op')].filter(o => o.offsetParent !== null && o.closest('.mb-sub2, .mb-sub') === nivel);
    const i = ops.indexOf(document.activeElement);
    if (ev.key === 'Escape') { abrirMenu(it, false); b.focus(); }
    else if (i >= 0 && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) { ev.preventDefault(); ops[(i + (ev.key === 'ArrowDown' ? 1 : ops.length - 1)) % ops.length].focus(); }
  });
  it.addEventListener('pointerenter', () => posicionarSub(it));
  it.addEventListener('pointerleave', ev => { it.classList.remove('suprimir'); if (ev.pointerType === 'mouse') abrirMenu(it, false); });
}
for (const g of document.querySelectorAll('.mb-grupo')) {
  const gb = g.querySelector('.mb-op-sub'), sub2 = g.querySelector('.mb-sub2');
  g.addEventListener('pointerenter', () => posicionarSub2(g));
  gb.addEventListener('click', () => abrirGrupo(g, !g.classList.contains('aberto')));
  gb.addEventListener('keydown', ev => { if (ev.key === 'ArrowRight') { ev.preventDefault(); ev.stopPropagation(); abrirGrupo(g, true, true); } });
  sub2.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft' || ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); abrirGrupo(g, false); gb.focus(); }
  });
}
document.addEventListener('click', ev => { for (const it of menusTopo) if (!it.contains(ev.target)) abrirMenu(it, false); });
for (const b of document.querySelectorAll('[data-aba]')) b.addEventListener('click', () => {
  fecharMenus();
  if (b.classList.contains('mb-op')) { b.blur(); b.closest('.mb-item').classList.add('suprimir'); }
  usar(null);
  const acao = b.dataset.acao;
  if (acao === 'fisica' || acao === 'juridica') { novoRegistro('pessoas', { tipo: acao }); return; }
  if (TIPOS_IMOVEL[acao]) { novoRegistro('imoveis', { tipo: acao }); return; }
  if (acao && acao.startsWith('tabela:')) { abrirTabela(acao.slice(7)); return; }
  abrirJanela({ aba: b.dataset.aba, criando: !!b.dataset.novo });
});
// Esc fecha o diálogo mais à frente: o da janela em uso ou, fora das janelas, o da página
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  // sem foco em lugar nenhum (o botão clicado saiu da tela), vale a janela ativa
  const ativa = janelas.find(x => x.el.classList.contains('ativa'));
  const dono = (ev.target.closest && ev.target.closest('.jan')) || (ev.target === document.body && ativa ? ativa.el : null);
  const m = [...(dono ? dono.querySelectorAll(':scope > .modal') : document.querySelectorAll('body > .modal'))].pop();
  if (m && m._fechar) { ev.preventDefault(); m._fechar(); }
});
const bLado = document.getElementById('lado-a-lado');
bLado.prepend(ico('ladoALado'));
bLado.addEventListener('click', ladoALado);
if ('ResizeObserver' in window) new ResizeObserver(ajustarJanelas).observe(area);
else addEventListener('resize', ajustarJanelas);
const menu = $('#menu-backup');
$('#bk-exportar').append(ico('baixar'), 'Exportar backup (JSON)');
$('#bk-importar').append(ico('enviar'), 'Importar arquivo JSON');
$('#bk-exportar').addEventListener('click', () => { menu.open = false; exportarBackup(); });
$('#bk-importar').addEventListener('click', () => { menu.open = false; $('#arquivo').click(); });
document.addEventListener('click', ev => { if (menu.open && !menu.contains(ev.target)) menu.open = false; });
$('#arquivo').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (f) importarArquivo(f); });
Store.aoStatus = (estado, txt) => { const s = $('#salvo'); s.dataset.estado = estado; s.textContent = txt; };
Store.aoRemoto = () => atualizarJanelas();
addEventListener('pagehide', () => Store.descarregar());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.descarregar(); });

ajustarJanelas();
marcarMenu();
Store.status();
Store.iniciar().then(atualizarJanelas);
})();
</script>
</body>
