/* ---------- questionário (usado na análise e na visualização) ---------- */
function montarQuestionario(modelo, resp, aoMudar) {
  const idx = indexar(modelo.perguntas);
  const els = new Map();
  const raiz = h('div', { class: 'quest' });

  function definir(q, r) {
    const vazio = !respondida(q, r) && !(r && r.obs);
    if (vazio) delete resp[q.id]; else resp[q.id] = r;
  }
  function clicar(q, o) {
    const r = Object.assign({}, resp[q.id] || {});
    if (q.tipo === 'multipla') {
      const cur = Array.isArray(r.v) ? r.v.slice() : [];
      const i = cur.indexOf(o.id);
      if (i >= 0) cur.splice(i, 1); else cur.push(o.id);
      r.v = cur;
    } else r.v = r.v === o.id ? null : o.id;
    definir(q, r);
    atualizar();
    aoMudar();
  }
  function cartao(q) {
    const info = idx.mapa.get(q.id);
    const r0 = resp[q.id] || {};
    const e = { botoes: new Map() };
    const carimbo = h('span', { class: 'carimbo', hidden: true }, 'Pendência');
    const cab = h('div', { class: 'q-cab' },
      h('span', { class: 'q-estado', 'aria-hidden': 'true' }),
      h('span', { class: 'q-num' }, info.num),
      h('p', { class: 'q-txt', id: 'qt-' + q.id }, q.texto || 'Pergunta sem texto'),
      carimbo);
    const corpo = h('div', { class: 'q-corpo' });
    if (q.fundamento) corpo.append(h('p', { class: 'q-fund' }, q.fundamento));
    if (ehEscolha(q.tipo)) {
      const grupo = h('div', { class: 'q-ops', role: 'group', 'aria-labelledby': 'qt-' + q.id });
      for (const o of q.opcoes) {
        const b = h('button', {
          type: 'button', class: 'op' + (o.pendencia ? ' op-pend' : ''), 'data-multi': q.tipo === 'multipla',
          'aria-pressed': 'false', onclick: () => clicar(q, o)
        }, o.rotulo || '(sem rótulo)');
        e.botoes.set(o.id, b);
        grupo.append(b);
      }
      corpo.append(grupo);
    } else if (q.tipo === 'texto') {
      const t = h('textarea', { class: 'inp', id: 'r-' + q.id, rows: '2', 'aria-labelledby': 'qt-' + q.id, placeholder: 'Resposta', value: r0.v || '' });
      t.addEventListener('input', () => { autoAltura(t); definir(q, Object.assign({}, resp[q.id] || {}, { v: t.value })); atualizar(); aoMudar(); });
      corpo.append(t);
      requestAnimationFrame(() => autoAltura(t));
    } else if (q.tipo === 'data') {
      const i = h('input', { class: 'inp', type: 'date', id: 'r-' + q.id, style: 'max-width:200px', 'aria-labelledby': 'qt-' + q.id, value: r0.v || '' });
      i.addEventListener('change', () => { definir(q, Object.assign({}, resp[q.id] || {}, { v: i.value })); atualizar(); aoMudar(); });
      corpo.append(i);
    }
    const extra = h('div', { class: 'q-extra' });
    let ajuda = null;
    if (q.ajuda) {
      ajuda = h('p', { class: 'q-ajuda', hidden: true, id: 'qa-' + q.id }, q.ajuda);
      const b = btn('Orientação', { icone: 'info', fant: true, sm: true });
      b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-controls', idJ('qa-' + q.id));
      b.onclick = () => { ajuda.hidden = !ajuda.hidden; b.setAttribute('aria-expanded', String(!ajuda.hidden)); };
      extra.append(b);
    }
    const obs = h('textarea', { class: 'inp', id: 'o-' + q.id, rows: '2', placeholder: 'Observação sobre este item (aparece no relatório)', 'aria-label': 'Observação', value: r0.obs || '' });
    const obsBox = h('div', { class: 'campo', hidden: !r0.obs }, obs);
    obs.addEventListener('input', () => { autoAltura(obs); definir(q, Object.assign({}, resp[q.id] || {}, { obs: obs.value })); aoMudar(); });
    const bObs = btn(r0.obs ? 'Observação' : 'Adicionar observação', { icone: 'nota', fant: true, sm: true });
    bObs.setAttribute('aria-expanded', String(!!r0.obs));
    bObs.onclick = () => { obsBox.hidden = !obsBox.hidden; bObs.setAttribute('aria-expanded', String(!obsBox.hidden)); if (!obsBox.hidden) { autoAltura(obs); obs.focus(); } };
    if (r0.obs) requestAnimationFrame(() => autoAltura(obs));
    extra.append(bObs);
    corpo.append(extra);
    if (ajuda) corpo.append(ajuda);
    corpo.append(obsBox);
    const prov = h('p', { class: 'q-prov', hidden: true }, h('strong', null, 'Providência: '), q.providencia || 'Registre na observação a providência necessária.');
    corpo.append(prov);
    const card = h('article', { class: 'q', id: 'q-' + q.id, 'aria-labelledby': 'qt-' + q.id }, cab, corpo);
    if (q.filhos.length) {
      const fb = h('div', { class: 'q-filhos' });
      construir(q.filhos, fb);
      card.append(fb);
    }
    Object.assign(e, { card, carimbo, prov });
    els.set(q.id, e);
    return card;
  }
  function construir(lista, destino) {
    for (const no of lista) {
      if (no.tipo === 'secao') {
        const corpo = h('div', { class: 'quest' });
        const sec = h('section', { class: 'q-sec', 'aria-labelledby': 'st-' + no.id },
          h('header', { class: 'q-sec-cab' },
            h('h2', { class: 'q-sec-tit', id: 'st-' + no.id }, no.texto || 'Seção sem título'),
            no.fundamento ? h('span', { class: 'q-sec-ref' }, no.fundamento) : null),
          corpo);
        els.set(no.id, { card: sec, secao: true });
        construir(no.filhos, corpo);
        destino.append(sec);
      } else destino.append(cartao(no));
    }
  }
  construir(modelo.perguntas, raiz);
  if (!modelo.perguntas.length) raiz.append(h('p', { class: 'dica' }, 'Este checklist ainda não tem perguntas.'));

  let filtro = 'todas';
  function atualizar(novoFiltro) {
    if (novoFiltro) filtro = novoFiltro;
    const casa = {}, mostra = {};
    for (const id of idx.ordem) {
      const info = idx.mapa.get(id), e = els.get(id);
      if (info.no.tipo === 'secao') continue;
      const q = info.no, r = resp[id];
      const vis = visivel(info, idx, resp);
      const feita = respondida(q, r), pend = feita && temPendencia(q, r);
      e.card.classList.toggle('respondida', feita);
      e.card.classList.toggle('pendente', pend);
      e.carimbo.hidden = !pend;
      e.prov.hidden = !pend;
      const sel = selecionadas(q, r);
      for (const [oid, b] of e.botoes) b.setAttribute('aria-pressed', String(sel.includes(oid)));
      casa[id] = vis && (filtro === 'todas' || (filtro === 'abertas' && !feita) || (filtro === 'pendencias' && pend));
      mostra[id] = vis;
    }
    // de baixo para cima: um item fora do filtro continua visível (compacto) se algum descendente estiver no filtro
    const exibe = {};
    for (let i = idx.ordem.length - 1; i >= 0; i--) {
      const id = idx.ordem[i], info = idx.mapa.get(id), e = els.get(id);
      const desc = info.no.filhos.some(f => exibe[f.id]);
      if (info.no.tipo === 'secao') { exibe[id] = desc; e.card.hidden = !desc; continue; }
      exibe[id] = mostra[id] && (casa[id] || desc);
      e.card.hidden = !exibe[id];
      e.card.classList.toggle('compacto', exibe[id] && !casa[id]);
    }
  }
  function irPara(id) {
    const e = els.get(id);
    if (!e) return;
    if (e.card.hidden) atualizar('todas');
    e.card.scrollIntoView({ block: 'center', behavior: reduzMov ? 'auto' : 'smooth' });
    e.card.classList.add('destaque');
    setTimeout(() => e.card.classList.remove('destaque'), 1600);
  }
  atualizar();
  return { el: raiz, atualizar, irPara, filtroAtual: () => filtro };
}

/* ---------- protocolo como centro: imóveis e pessoas ligados a ele ---------- */
const QUALIDADES_PROT = ['Requerente', 'Beneficiário', 'Ocupante', 'Proprietário', 'Confrontante', 'Outro'];
const imoveisDoProtocolo = id => imoveisOrdenados().filter(i => i.protocoloId === id);
/* pessoas do protocolo: as partes vinculadas diretamente e as que vêm pelos imóveis do protocolo */
function pessoasDoProtocolo(p) {
  const diretas = p.partes.map(x => ({ pessoa: D().pessoas[x.pessoaId], qualidade: qualidadeParte(x) })).filter(x => x.pessoa);
  const pelosImoveis = [];
  for (const i of imoveisDoProtocolo(p.id)) for (const v of i.vinculos) {
    const pe = D().pessoas[v.pessoaId];
    if (pe) pelosImoveis.push({ pessoa: pe, qualidade: v.qualidade, imovel: i });
  }
  const unicas = new Set([...diretas, ...pelosImoveis].map(x => x.pessoa.id));
  return { diretas, pelosImoveis, total: unicas.size };
}
function excluirProtocolo(p) {
  for (const i of imoveisDoProtocolo(p.id)) { i.protocoloId = ''; Store.put('imoveis', i, 0); }
  for (const a of p.arquivos) Arquivos.apagar(a).catch(() => {});
  Store.remover('protocolos', p.id); ui.sel.protocolos = null; garantirSelecao(); mostrarDetalhe(false); renderTudo();
  toast('Protocolo excluído. Checklists, imóveis e pessoas continuam cadastrados.');
}

// o que está entre colchetes no texto vira campo a preencher (destacado)
function marcarColchetes(raiz) {
  const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && n.parentElement.closest('.campo-vazio,.campo-auto') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });
  const textos = [];
  while (w.nextNode()) if (/\[[^\[\]\n]{1,160}\]/.test(w.currentNode.nodeValue)) textos.push(w.currentNode);
  for (const t of textos) {
    const partes = t.nodeValue.split(/(\[[^\[\]\n]{1,160}\])/);
    t.replaceWith(...partes.filter(Boolean).map(s => (/^\[.*\]$/.test(s) ? Object.assign(document.createElement('span'), { className: 'campo-vazio', textContent: s }) : document.createTextNode(s))));
  }
}
function paraMaiusculas(raiz) {
  const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
  while (w.nextNode()) w.currentNode.nodeValue = w.currentNode.nodeValue.toLocaleUpperCase('pt-BR');
}
function preencherUma(html, d, ctx) {
  const t = document.createElement('template');
  t.innerHTML = html.replace(/\u200B/g, '');
  for (const s of [...t.content.querySelectorAll('.campo-auto')]) {
    const c = CAMPO_MINUTA[String(s.dataset.campo || '').toLowerCase()];
    const f = document.createElement('template');
    f.innerHTML = c ? c.v(d, ctx) : falta(s.textContent);
    if (s.dataset.maiusc) paraMaiusculas(f.content);
    const pai = s.parentElement;
    if (c && c.bloco && pai && /^(P|DIV|LI|H\d)$/.test(pai.tagName)) {
      // listas e tabelas não cabem dentro de um parágrafo: ocupam o parágrafo ou vêm logo depois dele
      const sozinho = [...pai.childNodes].every(n => n === s || n.nodeName === 'BR' || (n.nodeType === 3 && !n.nodeValue.trim()));
      if (sozinho) pai.replaceWith(f.content); else { s.remove(); pai.after(f.content); }
    } else s.replaceWith(f.content);
  }
  marcarColchetes(t.content);
  return t.innerHTML;
}

// janela Minuta: à esquerda a lista (Adicionar e Excluir), à direita o editor; dois cliques abrem a minuta.

function blocoMinutas(p, op = {}) {
  const chave = op.chave || 'minutas';
  const dados = op.dados || (() => dadosMinuta(p));
  const gravar = op.salvar || (atraso => Store.put('protocolos', p, atraso));
  const registrar = op.registrar || (msg => registrarAndamento(p, msg));
  const nomeArq = op.nomeArquivo || (m => nomeArquivoMinuta(m, p));
  const T = op.termo
    ? { lista: 'Termos da pessoa', item: 'Termo', aberta: 'Nenhum termo aberto.', nova: 'Novo termo', semTitulo: 'Termo sem título', nenhuma: 'Nenhum termo.', abre: 'Dois cliques abrem o termo', titulo: 'Título do termo' }
    : { lista: 'Minutas do protocolo', item: 'Minuta', aberta: 'Nenhuma minuta aberta.', nova: 'Nova minuta', semTitulo: 'Minuta sem título', nenhuma: 'Nenhuma minuta.', abre: 'Dois cliques abrem a minuta', titulo: 'Título da minuta' };
  const lado = h('section', { class: 'dl', 'aria-label': T.lista });
  const editor = h('section', { class: 'arq-visor min-editor', 'aria-label': T.item });
  const raiz = h('div', { class: 'arq-grade' }, lado, editor);
  // op.estado guarda qual está aberta, para a tela voltar igual quando a janela é redesenhada
  const est = op.estado || {};
  let sel = null, aberta = null, escolhendo = false;
  const vazio = () => { est.aberta = null; editor.replaceChildren(h('p', { class: 'arq-vazio' }, T.aberta)); };
  const escolherModelo = () => {
    escolhendo = true; aberta = null; desenhar();
    editor.replaceChildren(
      h('div', { class: 'arq-visor-cab' }, h('span', { class: 'arq-visor-nome' }, T.nova),
        btn('Cancelar', { fant: true, sm: true, onclick: () => { escolhendo = false; vazio(); desenhar(); } })),
      escolhaModelos(modelosMinuta().filter(m => paraUso(m, op.termo ? 'parte' : 'protocolo')), criar));
  };
  const criar = modelo => {
    const m = { id: uid('mi'), modelo: modelo.id, titulo: modelo.nome, html: preencherModelo(modelo.html, dados()), criadaEm: agora(), atualizadaEm: agora() };
    p[chave].push(m);
    registrar(`Minuta “${m.titulo}” criada.`);
    gravar(0);
    escolhendo = false;
    abrir(m);
  };
  const abrir = m => {
    sel = aberta = est.aberta = m.id; escolhendo = false; desenhar();
    const salvar = () => { m.atualizadaEm = agora(); gravar(); };
    const titulo = h('input', { class: 'inp min-titulo', 'aria-label': T.titulo, value: m.titulo });
    titulo.addEventListener('input', () => { m.titulo = titulo.value; salvar(); desenhar(); });
    const ed = editorTexto({ html: m.html, aoMudar: html => { m.html = html; salvar(); } });
    // no alto o título e os botões; logo abaixo, numa linha só dela, a barra de formatação
    editor.replaceChildren(
      h('div', { class: 'arq-visor-cab min-cab' }, titulo,
        !Store.emArtifact ? btn('Imprimir', { icone: 'imprimir', sm: true, onclick: () => imprimirMinuta(m) }) : null,
        btn('Baixar Word', { icone: 'baixar', sm: true, prim: true, onclick: () => baixar(nomeArq(m) + '.docx', minutaDocx(m.html)) })),
      h('div', { class: 'min-ferramentas' }, ed.barra),
      h('div', { class: 'arq-visor-corpo min-corpo' }, ed.folha));
  };
  const desenhar = () => {
    if (!p[chave].some(m => m.id === sel)) sel = null;
    if (aberta && !p[chave].some(m => m.id === aberta)) { aberta = null; vazio(); }
    const linhas = p[chave].map(m => h('button', {
      type: 'button', class: 'dl-linha' + (m.id === aberta ? ' aberto' : ''), 'aria-pressed': String(m.id === sel), title: T.abre,
      onclick: ev => { sel = m.id; for (const b of linhas) b.setAttribute('aria-pressed', String(b === ev.currentTarget)); bExcluir.disabled = false; },
      ondblclick: () => { if (m.id !== aberta) abrir(m); },
      onkeydown: ev => { if (ev.key === 'Enter') { ev.preventDefault(); if (m.id !== aberta) abrir(m); } }
    }, h('span', { class: 'dl-nome' }, m.titulo || T.semTitulo), h('small', null, fmtData(m.atualizadaEm))));
    const bExcluir = btn('Excluir', { icone: 'lixo', perigo: true, disabled: !sel, onclick: ev => armar(ev.currentTarget, () => {
      const m = p[chave].find(x => x.id === sel);
      if (!m) return;
      p[chave] = p[chave].filter(x => x !== m);
      registrar(`Minuta “${m.titulo}” excluída.`);
      gravar(0);
      sel = null;
      desenhar();
    }) });
    lado.replaceChildren(h('div', { class: 'dl-lista' }, linhas.length ? linhas : h('p', { class: 'dica' }, T.nenhuma)),
      h('div', { class: 'dl-bts' }, btn('Adicionar', { icone: 'mais', prim: true, disabled: escolhendo, onclick: escolherModelo }), bExcluir));
  };
  const ini = est.aberta && p[chave].find(m => m.id === est.aberta);
  if (ini) abrir(ini); else { vazio(); desenhar(); }
  return { el: raiz, desenhar };
}

function propriedadesDe(pe) {
  if (D().pessoas[pe.id]) return imoveisDaPessoa(pe.id);

  if (D().pessoas[pe.id]) { i.vinculos.push({ pessoaId: pe.id, qualidade }); levarAoProtocolo(pe.id, i); Store.put('imoveis', i, 0); }
  else vinculosPendentes.set(pe, [...(vinculosPendentes.get(pe) || []), { imovelId, qualidade }]);

  const i = D().imoveis[imovelId];

  else vinculosPendentes.set(pe, (vinculosPendentes.get(pe) || []).filter(v => v.imovelId !== imovelId));
}

function levarAoProtocolo(pessoaId, i) {

  const pr = protocolosOrdenados().find(x => x.partes.some(y => y.pessoaId === pessoaId));

const descImovel = i => (i.tipo === 'urbano' && [i.nucleo, i.quadra && 'Quadra ' + i.quadra, i.lote && 'Lote ' + i.lote].filter(Boolean).join(', ')) || tituloImovel(i);

async function buscarCep(end, pref, cep, depois) {
  const jan = J;
  const d = String(cep).replace(/\D/g, '');
  if (d.length !== 8) { toast('Digite os 8 números do CEP.'); return; }
  try {
    const r = await fetch('https://viacep.com.br/ws/' + d + '/json/');
    const j = await r.json();
    if (j.erro) { toast('CEP não encontrado.'); return; }
    const partes = String(j.logradouro || '').split(' ');
    const tipo = TIPOS_LOGRADOURO.find(t => norm(t) === norm(partes[0]));
    Object.assign(end, {
      tipo: tipo || end.tipo, logradouro: tipo ? partes.slice(1).join(' ') : (j.logradouro || end.logradouro),
      bairro: j.bairro || end.bairro, municipio: j.localidade ? j.localidade + '/' + j.uf : end.municipio,
      complemento: end.complemento || j.complemento || ''
    });
    if (!jan.el.isConnected) return;
    usar(jan);
    depois();
    toast('Endereço preenchido pelo CEP.');
  } catch (e) { toast('Não foi possível consultar o CEP agora. Preencha o endereço manualmente.'); }
}

    if (info.secao && info.secao.id !== ultimaSec) {

  }
  if (aba === 'modelosMinuta') return 'Modelos de Minuta';
  return det && TABELAS[ui.tabela] ? TABELAS[ui.tabela].nome : 'Tabelas de indicadores';
}
function atualizarTitulo() {
  if (!J) return;
  const t = tituloJanela();
  if (t !== J.titulo) { J.titulo = t; $('#jan-tit').textContent = t; desenharTarefas(); }
  marcarMenu();
}
/* uma mudança feita numa janela aparece nas outras que mostram os mesmos dados */
const DEPENDE = {
  protocolos: ['protocolos', 'imoveis', 'pessoas', 'analises'], pessoas: ['pessoas', 'imoveis', 'protocolos', 'tabelas'],
  imoveis: ['imoveis', 'pessoas', 'protocolos'], analises: ['analises', 'protocolos', 'modelos'],
  modelos: ['modelos', 'analises'], tabelas: ['tabelas', 'pessoas'], modelosMinuta: ['modelosMinuta']
};
const mudados = new Set();
let tAtualizar = null;
Store.aoMudar = col => { mudados.add(col); clearTimeout(tAtualizar); tAtualizar = setTimeout(atualizarOutras, 250); };
// campos de formulário ainda não enviados (recepção, andamento, lançamento…) sobrevivem ao redesenho
const camposForm = raiz => [...raiz.querySelectorAll('form input, form textarea, form select')].filter(c => !c.readOnly && !['file', 'hidden', 'submit', 'button'].includes(c.type));
const chaveCampo = c => [c.tagName, c.type, c.id, c.name, c.closest('form').className].join('|');
function redesenhar(j) {
  usar(j);
  j.adiado = false;
  const dl = j.ui.dialogo;
  if (dl) { renderItens(); if (dl.atualizar) dl.atualizar(); return; }
  const y = j.corpo.scrollTop;
  const antes = camposForm(j.corpo).map(c => [chaveCampo(c), c.type === 'checkbox' ? c.checked : c.value]);
  renderLateral();
  renderDetalhe();
  const depois = camposForm(j.corpo);
  if (depois.length === antes.length) depois.forEach((c, i) => {
    const [k, v] = antes[i];
    if (chaveCampo(c) !== k) return;
    if (typeof v === 'boolean') c.checked = v; else c.value = v;
  });
  j.corpo.scrollTop = y;
}
// quem está com o foco num campo ou botão da janela não perde o que está fazendo: ela espera o foco sair
const emUso = j => { const a = document.activeElement; return j.el.contains(a) && (/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(a.tagName) || a.isContentEditable); };
function atualizarOutras() {
  const cols = [...mudados];
  mudados.clear();
  atualizarJanelas(cols);
}
// sem cols: todas as janelas (carga inicial, importação, alterações vindas de outro aparelho)
function atualizarJanelas(cols) {
  const antes = J;
  for (const j of janelas) {
    if (cols && !DEPENDE[j.ui.aba].some(c => cols.includes(c))) continue;
    if (emUso(j)) { usar(j); renderItens(); j.adiado = true; }
    else redesenhar(j);
  }
  usar(antes && antes.el.isConnected ? antes : null);
}

/* ---------- ligação inicial ---------- */
$('#lista-nacionalidades').append(...NACIONALIDADES.map(n => h('option', { value: n })));
/* menus do topo (Cadastros, Recepção): abrem ao passar o mouse, com toque ou pelo teclado */
const menusTopo = [...document.querySelectorAll('.mb-item')].filter(it => it.querySelector('.mb-sub'));
/* mantém o submenu dentro da tela (celular): encosta à direita do botão se passar da borda */
function posicionarSub(it) {
  const sub = it.querySelector('.mb-sub');
  sub.style.left = ''; sub.style.right = '';
  const r = sub.getBoundingClientRect();
  if (!r.width) return;
  if (r.right > innerWidth - 8) {
    sub.style.left = 'auto'; sub.style.right = '0';
    if (sub.getBoundingClientRect().left < 8) { sub.style.right = 'auto'; sub.style.left = (8 - it.getBoundingClientRect().left) + 'px'; }
  }
}
function abrirGrupo(g, sim, focar) {
  const gb = g.querySelector('.mb-op-sub'), sub2 = g.querySelector('.mb-sub2');
  g.classList.toggle('aberto', sim);
  gb.setAttribute('aria-expanded', String(sim));
  if (sim) { posicionarSub2(g); if (focar) sub2.querySelector('.mb-op').focus(); }
}
/* abre o submenu em cascata à esquerda quando não cabe à direita */
function posicionarSub2(g) {
  const sub2 = g.querySelector('.mb-sub2');
  sub2.classList.remove('esq');
  if (getComputedStyle(sub2).position === 'absolute' && sub2.getBoundingClientRect().right > innerWidth - 8) sub2.classList.add('esq');
}
function abrirMenu(it, sim, focar) {
  it.classList.toggle('aberto', sim);
  if (!sim) for (const g of it.querySelectorAll('.mb-grupo')) abrirGrupo(g, false);
  if (sim) { it.classList.remove('suprimir'); posicionarSub(it); }
  it.querySelector('.mb-btn').setAttribute('aria-expanded', String(sim));
  if (sim && focar) it.querySelector('.mb-op').focus();
}
const fecharMenus = exceto => { for (const it of menusTopo) if (it !== exceto) abrirMenu(it, false); };
for (const it of menusTopo) {
  const b = it.querySelector('.mb-btn');
  b.addEventListener('click', () => { const abrir = !it.classList.contains('aberto'); fecharMenus(it); abrirMenu(it, abrir); });
  b.addEventListener('keydown', ev => { if (ev.key === 'ArrowDown') { ev.preventDefault(); ev.stopPropagation(); fecharMenus(it); abrirMenu(it, true, true); } });
  it.addEventListener('keydown', ev => {
    const nivel = document.activeElement.closest('.mb-sub2, .mb-sub');
    const ops = [...it.querySelectorAll('.mb-op')].filter(o => o.offsetParent !== null && o.closest('.mb-sub2, .mb-sub') === nivel);
    const i = ops.indexOf(document.activeElement);
    if (ev.key === 'Escape') { abrirMenu(it, false); b.focus(); }
    else if (i >= 0 && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) { ev.preventDefault(); ops[(i + (ev.key === 'ArrowDown' ? 1 : ops.length - 1)) % ops.length].focus(); }
  });
  it.addEventListener('pointerenter', () => posicionarSub(it));
  it.addEventListener('pointerleave', ev => { it.classList.remove('suprimir'); if (ev.pointerType === 'mouse') abrirMenu(it, false); });
}
for (const g of document.querySelectorAll('.mb-grupo')) {
  const gb = g.querySelector('.mb-op-sub'), sub2 = g.querySelector('.mb-sub2');
  g.addEventListener('pointerenter', () => posicionarSub2(g));
  gb.addEventListener('click', () => abrirGrupo(g, !g.classList.contains('aberto')));
  gb.addEventListener('keydown', ev => { if (ev.key === 'ArrowRight') { ev.preventDefault(); ev.stopPropagation(); abrirGrupo(g, true, true); } });
  sub2.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft' || ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); abrirGrupo(g, false); gb.focus(); }
  });
}
document.addEventListener('click', ev => { for (const it of menusTopo) if (!it.contains(ev.target)) abrirMenu(it, false); });
for (const b of document.querySelectorAll('[data-aba]')) b.addEventListener('click', () => {
  fecharMenus();
  if (b.classList.contains('mb-op')) { b.blur(); b.closest('.mb-item').classList.add('suprimir'); }
  usar(null);
  const acao = b.dataset.acao;
  if (acao === 'fisica' || acao === 'juridica') { novoRegistro('pessoas', { tipo: acao }); return; }
  if (TIPOS_IMOVEL[acao]) { novoRegistro('imoveis', { tipo: acao }); return; }
  if (acao && acao.startsWith('tabela:')) { abrirTabela(acao.slice(7)); return; }
  // Modelos de Minuta: uma janela só (dois editores do mesmo modelo se atrapalhariam)
  const jm = b.dataset.aba === 'modelosMinuta' && janelas.find(x => x.ui.aba === 'modelosMinuta');
  if (jm) { ativar(jm); focarJanela(jm); return; }
  abrirJanela({ aba: b.dataset.aba, criando: !!b.dataset.novo });
});
// Esc fecha o diálogo mais à frente: o da janela em uso ou, fora das janelas, o da página
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  // sem foco em lugar nenhum (o botão clicado saiu da tela), vale a janela ativa
  const ativa = janelas.find(x => x.el.classList.contains('ativa'));
  const dono = (ev.target.closest && ev.target.closest('.jan')) || (ev.target === document.body && ativa ? ativa.el : null);
  const m = [...(dono ? dono.querySelectorAll(':scope > .modal') : document.querySelectorAll('body > .modal'))].pop();
  if (m && m._fechar) { ev.preventDefault(); m._fechar(); }
});
const bLado = document.getElementById('lado-a-lado');
bLado.prepend(ico('ladoALado'));
bLado.addEventListener('click', ladoALado);
if ('ResizeObserver' in window) new ResizeObserver(ajustarJanelas).observe(area);
else addEventListener('resize', ajustarJanelas);
/* menu Sistema: cópia de segurança */
const deMenu = b => { fecharMenus(); b.blur(); const it = b.closest('.mb-item'); if (it) it.classList.add('suprimir'); };
$('#bk-exportar').addEventListener('click', ev => { deMenu(ev.currentTarget); exportarBackup(); });
$('#bk-importar').addEventListener('click', ev => { deMenu(ev.currentTarget); $('#arquivo').click(); });
/* barra de ícones: cada botão aciona a opção de menu correspondente */
for (const b of document.querySelectorAll('.fb')) b.addEventListener('click', () => document.getElementById(b.dataset.alvo).click());
/* logotipo: marca-d'água da área de trabalho e ícone das janelas */
const logo = document.querySelector('.marca img').getAttribute('src');
document.querySelector('.marca-dagua img').src = logo;
document.documentElement.style.setProperty('--logo', `url("${logo}")`);
$('#status-data').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
$('#arquivo').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (f) importarArquivo(f); });
Store.aoStatus = (estado, txt) => { const s = $('#salvo'); s.dataset.estado = estado; s.textContent = txt; };
Store.aoRemoto = () => atualizarJanelas();
addEventListener('pagehide', () => Store.descarregar());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.descarregar(); });

ajustarJanelas();
marcarMenu();
Store.status();
Store.iniciar().then(atualizarJanelas);
})();
</script>
</body>
